<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger & Social App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mobile Smooth Touch scrolling */
        .page-view {
            display: none;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page-view.active {
            display: flex;
            flex-direction: column;
        }

        .nav-item.active {
            color: #1877f2;
        }

        .nav-item.active i {
            transform: scale(1.15);
            transition: transform 0.2s ease;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden select-none">

    <div id="auth-screen" class="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center p-6">
        <div class="text-center max-w-sm w-full">
            <div
                class="w-20 h-20 bg-gradient-to-tr from-blue-500 to-teal-400 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-200">
                <i class="fas fa-bolt text-white text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight mb-2">Connect Space</h1>
            <p class="text-gray-500 text-sm mb-8">Chat, share stories, and make live calls effortlessly with your
                friends.</p>
            <button id="btn-login"
                class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3.5 px-6 rounded-xl shadow-sm flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                <i class="fab fa-google text-lg text-red-400"></i> Continue with Google
            </button>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden pb-16">

        <header id="global-header"
            class="bg-white/90 backdrop-blur-md border-b px-4 py-3 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-2.5">
                <img id="user-profile-pic" src="" alt="Me"
                    class="w-9 h-9 rounded-full object-cover border border-gray-100 shadow-sm">
                <span id="user-display-name"
                    class="font-bold text-gray-800 text-base truncate max-w-[120px]">User</span>
            </div>
            <div id="app-title-text" class="text-lg font-black tracking-tight text-gray-900">Chats</div>
            <button id="btn-logout"
                class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:text-red-500 active:scale-95 transition">
                <i class="fas fa-sign-out-alt text-sm"></i>
            </button>
        </header>

        <div class="flex-1 overflow-hidden relative">

            <div id="page-chats" class="page-view active">
                <div class="p-3 bg-white border-b">
                    <div class="relative">
                        <input type="text" id="search-user" placeholder="Search friends by email..."
                            class="w-full bg-gray-100 py-2.5 pl-10 pr-4 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <i class="fas fa-search absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                    </div>
                    <div id="search-results"
                        class="mt-2 hidden max-h-48 overflow-y-auto border border-gray-100 rounded-xl bg-white absolute left-3 right-3 z-50 shadow-xl">
                    </div>
                </div>
                <div id="chats-list-container" class="flex-1 p-3 space-y-2">
                </div>
            </div>

            <div id="page-requests" class="page-view">
                <div class="p-4 bg-gray-50 min-h-full">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pending Connections</h3>
                    <div id="requests-list-container" class="space-y-2.5">
                    </div>
                </div>
            </div>

            <div id="page-feed" class="page-view">
                <div class="p-4 space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs">
                        <textarea id="post-text" placeholder="What's on your mind? Share an update..." rows="3"
                            class="w-full bg-gray-50 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/10 border border-gray-100 resize-none"></textarea>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-50">
                            <label
                                class="cursor-pointer bg-gray-50 px-3 py-2 rounded-xl text-xs font-semibold text-gray-600 flex items-center gap-2 active:bg-gray-100">
                                <input type="file" id="post-image-input" accept="image/*" class="hidden">
                                <i class="fas fa-image text-emerald-500 text-sm"></i> Add Photo
                            </label>
                            <button id="btn-submit-post"
                                class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md shadow-blue-100 active:scale-95 transition-all">Publish</button>
                        </div>
                    </div>
                    <div id="feed-stream" class="space-y-4 pb-8"></div>
                </div>
            </div>

            <div id="fullscreen-chat-view" class="fixed inset-0 bg-white z-50 hidden flex-col">
                <div class="p-3 border-b flex justify-between items-center bg-white/90 backdrop-blur shadow-xs">
                    <div class="flex items-center gap-3">
                        <button id="close-chat"
                            class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600 active:scale-90 transition"><i
                                class="fas fa-arrow-left"></i></button>
                        <img id="chat-user-pic" src="" class="w-9 h-9 rounded-full object-cover border">
                        <div>
                            <h4 id="chat-user-name" class="font-bold text-sm text-gray-800">User</h4>
                            <span class="text-[10px] text-emerald-500 font-semibold flex items-center gap-1"><span
                                    class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Online</span>
                        </div>
                    </div>
                    <div class="flex gap-2 text-blue-600">
                        <button id="btn-voice-call"
                            class="w-9 h-9 rounded-full hover:bg-blue-50 flex items-center justify-center"><i
                                class="fas fa-phone-alt text-base"></i></button>
                        <button id="btn-video-call"
                            class="w-9 h-9 rounded-full hover:bg-blue-50 flex items-center justify-center"><i
                                class="fas fa-video text-base"></i></button>
                    </div>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50/50"></div>
                <div class="p-3 border-t bg-white flex items-center gap-2 mb-safe">
                    <label
                        class="cursor-pointer text-gray-400 hover:text-blue-600 w-10 h-10 flex items-center justify-center active:scale-90 transition">
                        <input type="file" id="chat-image-input" accept="image/*" class="hidden">
                        <i class="fas fa-image text-lg"></i>
                    </label>
                    <button id="btn-voice-record"
                        class="text-gray-400 hover:text-blue-600 w-10 h-10 flex items-center justify-center active:scale-90 transition">
                        <i class="fas fa-microphone text-lg"></i>
                    </button>
                    <input type="text" id="chat-msg-input" placeholder="Aa"
                        class="flex-1 bg-gray-100 border border-transparent rounded-2xl py-2.5 px-4 text-sm focus:outline-none focus:bg-white focus:border-gray-200">
                    <button id="btn-send-msg"
                        class="text-blue-600 hover:text-blue-700 w-10 h-10 flex items-center justify-center active:scale-90 transition">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>

        </div>

        <nav
            class="fixed bottom-0 left-0 right-0 h-16 bg-white/95 backdrop-blur-md border-t flex justify-around items-center z-40 px-2 shadow-lg">
            <button data-target="chats"
                class="nav-item active flex flex-col items-center justify-center w-16 h-full text-gray-400 gap-1 transition-all">
                <i class="fas fa-comment-dots text-xl"></i>
                <span class="text-[10px] font-bold tracking-tight">Chats</span>
            </button>
            <button data-target="requests"
                class="nav-item flex flex-col items-center justify-center w-16 h-full text-gray-400 gap-1 transition-all">
                <div class="relative">
                    <i class="fas fa-user-friends text-xl"></i>
                    <span id="req-badge"
                        class="hidden absolute -top-1.5 -right-2 bg-red-500 text-white font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center border border-white">0</span>
                </div>
                <span class="text-[10px] font-bold tracking-tight">Requests</span>
            </button>
            <button data-target="feed"
                class="nav-item flex flex-col items-center justify-center w-16 h-full text-gray-400 gap-1 transition-all">
                <i class="fas fa-globe-americas text-xl"></i>
                <span class="text-[10px] font-bold tracking-tight">Feed</span>
            </button>
        </nav>

    </div>

    <div id="call-overlay"
        class="hidden fixed inset-0 bg-gray-900 z-50 flex flex-col justify-between p-6 text-white animate-fade-in">
        <div class="text-center pt-8">
            <h2 id="call-status" class="text-xl font-bold tracking-wide">Connecting Stream...</h2>
            <p id="call-target-name" class="text-gray-400 text-sm mt-1">User Profile</p>
        </div>
        <div class="flex-1 flex justify-center items-center relative my-6">
            <video id="remote-video" autoplay playsinline
                class="w-full h-full max-h-[60vh] bg-gray-950 rounded-2xl object-cover shadow-2xl"></video>
            <video id="local-video" autoplay playsinline muted
                class="w-24 h-36 bg-gray-800 rounded-xl object-cover absolute bottom-4 right-4 border-2 border-white shadow-md z-10"></video>
        </div>
        <div class="flex justify-center gap-8 pb-6">
            <button id="btn-toggle-mic"
                class="bg-white/10 backdrop-blur w-14 h-14 rounded-full flex items-center justify-center text-xl hover:bg-white/20 transition"><i
                    class="fas fa-microphone"></i></button>
            <button id="btn-end-call"
                class="bg-red-500 w-14 h-14 rounded-full flex items-center justify-center text-xl hover:bg-red-600 active:scale-95 shadow-lg shadow-red-500/20 transition"><i
                    class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // !!! আপনার Firebase প্রজেক্টের সঠিক কনফিগারেশন নিচে বসান !!!
        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let activeChatUser = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let localStream = null;
        let chatMessagesUnsubscribe = null;

        // UI Target Binding
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const searchInput = document.getElementById('search-user');
        const searchResults = document.getElementById('search-results');
        const chatsContainer = document.getElementById('chats-list-container');
        const requestsContainer = document.getElementById('requests-list-container');
        const feedStream = document.getElementById('feed-stream');
        const fullChatView = document.getElementById('fullscreen-chat-view');

        // --- AUTH PIPELINE ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                const res = await signInWithPopup(auth, provider);
                await setDoc(doc(db, "users", res.user.uid), {
                    uid: res.user.uid,
                    displayName: res.user.displayName,
                    email: res.user.email.toLowerCase(),
                    photoURL: res.user.photoURL,
                    friends: [],
                    requestsReceived: []
                }, { merge: true });
            } catch (err) { console.error("Auth Failure", err); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                document.getElementById('user-profile-pic').src = user.photoURL;
                document.getElementById('user-display-name').textContent = user.displayName;
                syncUserData();
                loadFeedTimeline();
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // --- SMART ROUTER / PAGE SWITCHER ---
        document.querySelectorAll('.nav-item').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active-tab', 'active'));
                const item = e.currentTarget;
                item.classList.add('active');

                const targetPage = item.getAttribute('data-target');
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));

                const activeView = document.getElementById(`page-${targetPage}`);
                activeView.classList.add('active');

                // Adjust Header Text dynamic state
                const titleMap = { 'chats': 'Chats', 'requests': 'Requests', 'feed': 'Social Feed' };
                document.getElementById('app-title-text').innerText = titleMap[targetPage];
            });
        });

        // --- DISCOVER / SEARCH USERS ---
        searchInput.addEventListener('input', async (e) => {
            const val = e.target.value.trim().toLowerCase();
            if (!val) { searchResults.classList.add('hidden'); return; }

            const q = query(collection(db, "users"), where("email", "==", val));
            const snap = await getDocs(q);
            searchResults.innerHTML = '';

            if (snap.empty) {
                searchResults.innerHTML = `<p class="p-3 text-xs text-gray-400 text-center">User not found</p>`;
            } else {
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.uid === currentUser.uid) return;
                    const block = document.createElement('div');
                    block.className = "p-3 flex items-center justify-between hover:bg-gray-50 border-b last:border-0";
                    block.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <img src="${data.photoURL}" class="w-7 h-7 rounded-full object-cover">
                            <span class="text-xs font-bold text-gray-700">${data.displayName}</span>
                        </div>
                        <button class="bg-blue-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg active:scale-95 send-req" data-id="${data.uid}">Connect</button>
                    `;
                    searchResults.appendChild(block);
                });
            }
            searchResults.classList.remove('hidden');
        });

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('send-req')) {
                const id = e.target.getAttribute('data-id');
                await updateDoc(doc(db, "users", id), { requestsReceived: arrayUnion(currentUser.uid) });
                e.target.innerText = "Requested";
                e.target.disabled = true;
                setTimeout(() => searchResults.classList.add('hidden'), 800);
            }
        });

        // --- REALTIME DATA SNAPSHOTS ---
        function syncUserData() {
            onSnapshot(doc(db, "users", currentUser.uid), (snapshot) => {
                const data = snapshot.data();
                if (!data) return;

                // Badge controller logic
                const reqCount = data.requestsReceived?.length || 0;
                const badge = document.getElementById('req-badge');
                if (reqCount > 0) {
                    badge.innerText = reqCount;
                    badge.classList.remove('hidden');
                } else { badge.classList.add('hidden'); }

                // Synchronize Active Contacts
                chatsContainer.innerHTML = '';
                if (data.friends && data.friends.length > 0) {
                    data.friends.forEach(async (fUid) => {
                        const fDoc = await getDoc(doc(db, "users", fUid));
                        if (fDoc.exists()) buildChatUserCard(fDoc.data());
                    });
                }

                // Synchronize Inbound Connection Requests
                requestsContainer.innerHTML = '';
                if (data.requestsReceived && data.requestsReceived.length > 0) {
                    data.requestsReceived.forEach(async (rUid) => {
                        const rDoc = await getDoc(doc(db, "users", rUid));
                        if (rDoc.exists()) buildRequestCard(rDoc.data());
                    });
                }
            });
        }

        function buildChatUserCard(user) {
            const div = document.createElement('div');
            div.className = "flex items-center gap-3.5 p-3 bg-white border border-gray-100 rounded-2xl active:bg-gray-50 transition cursor-pointer shadow-2xs";
            div.innerHTML = `
                <img src="${user.photoURL}" class="w-12 h-12 rounded-full object-cover border">
                <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-sm text-gray-800">${user.displayName}</h4>
                    <p class="text-xs text-gray-400 mt-0.5 truncate">Tap to open conversation</p>
                </div>
            `;
            div.onclick = () => openFullscreenMessenger(user);
            chatsContainer.appendChild(div);
        }

        function buildRequestCard(user) {
            const div = document.createElement('div');
            div.className = "p-3.5 bg-white border border-gray-100 rounded-2xl flex items-center justify-between shadow-xs";
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${user.photoURL}" class="w-9 h-9 rounded-full object-cover border">
                    <span class="text-xs font-bold text-gray-800">${user.displayName}</span>
                </div>
                <button class="bg-emerald-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl active:scale-95 accept-user" data-id="${user.uid}">Accept</button>
            `;
            requestsContainer.appendChild(div);
        }

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('accept-user')) {
                const id = e.target.getAttribute('data-id');
                const myRef = doc(db, "users", currentUser.uid);
                const targetRef = doc(db, "users", id);

                const myDoc = await getDoc(myRef);
                const currentReqs = myDoc.data().requestsReceived || [];
                const updatedReqs = currentReqs.filter(item => item !== id);

                await updateDoc(myRef, { friends: arrayUnion(id), requestsReceived: updatedReqs });
                await updateDoc(targetRef, { friends: arrayUnion(currentUser.uid) });
            }
        });

        // --- FULLSCREEN LIVE MESSENGER TIMELINE ---
        function openFullscreenMessenger(user) {
            activeChatUser = user;
            fullChatView.classList.remove('hidden');
            document.getElementById('chat-user-pic').src = user.photoURL;
            document.getElementById('chat-user-name').textContent = user.displayName;

            const roomCode = [currentUser.uid, activeChatUser.uid].sort().join("_");
            if (chatMessagesUnsubscribe) chatMessagesUnsubscribe();

            const q = query(collection(db, "chats", roomCode, "messages"), orderBy("timestamp", "asc"));
            chatMessagesUnsubscribe = onSnapshot(q, (snapshot) => {
                const area = document.getElementById('chat-messages');
                area.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isMe = data.senderId === currentUser.uid;
                    const bubbleRow = document.createElement('div');
                    bubbleRow.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                    let bubbleNode = `<p class="text-sm leading-relaxed">${data.text}</p>`;
                    if (data.type === 'image') bubbleNode = `<img src="${data.mediaUrl}" class="max-w-[70vw] rounded-xl border shadow-xs">`;
                    if (data.type === 'audio') bubbleNode = `<audio src="${data.mediaUrl}" controls class="max-w-[65vw] scale-90 origin-left"></audio>`;

                    bubbleRow.innerHTML = `
                        <div class="${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 rounded-bl-none'} max-w-[75vw] px-4 py-2.5 rounded-2xl shadow-2xs border border-transparent ${!isMe && 'border-gray-100'}">
                            ${bubbleNode}
                        </div>
                    `;
                    area.appendChild(bubbleRow);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        document.getElementById('close-chat').addEventListener('click', () => fullChatView.classList.add('hidden'));

        async function forwardChatMessage(payload, type = 'text') {
            if (!activeChatUser) return;
            const roomCode = [currentUser.uid, activeChatUser.uid].sort().join("_");
            await addDoc(collection(db, "chats", roomCode, "messages"), {
                senderId: currentUser.uid,
                timestamp: Date.now(),
                type: type,
                ...payload
            });
        }

        document.getElementById('btn-send-msg').addEventListener('click', () => {
            const bar = document.getElementById('chat-msg-input');
            if (!bar.value.trim()) return;
            forwardChatMessage({ text: bar.value.trim() }, 'text');
            bar.value = '';
        });

        document.getElementById('chat-image-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const path = ref(storage, `chats/${Date.now()}_${file.name}`);
            const meta = await uploadBytes(path, file);
            const link = await getDownloadURL(meta.ref);
            forwardChatMessage({ mediaUrl: link, text: '[Image]' }, 'image');
        });

        const voiceBtn = document.getElementById('btn-voice-record');
        voiceBtn.addEventListener('click', async () => {
            if (!mediaRecorder) {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const fileRef = ref(storage, `audio/${Date.now()}.mp3`);
                    const uploadSnap = await uploadBytes(fileRef, blob);
                    const streamURL = await getDownloadURL(uploadSnap.ref);
                    forwardChatMessage({ mediaUrl: streamURL, text: '[Voice Message]' }, 'audio');
                    audioChunks = [];
                };
                mediaRecorder.start();
                voiceBtn.classList.replace('text-gray-400', 'text-red-500');
            } else {
                mediaRecorder.stop();
                mediaRecorder = null;
                voiceBtn.classList.replace('text-red-500', 'text-gray-400');
            }
        });

        // --- SOCIAL CONTENT PUBLISHING PIPELINE (FIXED) ---
        document.getElementById('btn-submit-post').addEventListener('click', async () => {
            const contentText = document.getElementById('post-text').value;
            const postFile = document.getElementById('post-image-input').files[0];
            let postImageURL = null;

            if (!contentText.trim() && !postFile) return;

            try {
                if (postFile) {
                    const postRef = ref(storage, `posts/${Date.now()}_${postFile.name}`);
                    const uploadTask = await uploadBytes(postRef, postFile);
                    postImageURL = await getDownloadURL(uploadTask.ref);
                }

                // Cloud FireStore document insertions
                await addDoc(collection(db, "posts"), {
                    uid: currentUser.uid,
                    authorName: currentUser.displayName,
                    authorPic: currentUser.photoURL,
                    text: contentText,
                    image: postImageURL,
                    timestamp: Date.now()
                });

                // Clear states reset UI 
                document.getElementById('post-text').value = '';
                document.getElementById('post-image-input').value = '';
                alert("Post shared successfully!");
            } catch (error) {
                console.error("Post Submission Error:", error);
                alert("Could not post. Please check database write authorization rules.");
            }
        });

        function loadFeedTimeline() {
            const feedQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            onSnapshot(feedQuery, (snapshot) => {
                feedStream.innerHTML = '';
                if (snapshot.empty) {
                    feedStream.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">No posts active right now.</p>`;
                    return;
                }
                snapshot.forEach(doc => {
                    const postData = doc.data();
                    const entry = document.createElement('div');
                    entry.className = "bg-white p-4 rounded-2xl border border-gray-100 shadow-2xs";
                    entry.innerHTML = `
                        <div class="flex items-center gap-3 mb-3">
                            <img src="${postData.authorPic}" class="w-9 h-9 rounded-full object-cover border shadow-2xs">
                            <div>
                                <h4 class="font-bold text-xs text-gray-800">${postData.authorName}</h4>
                                <span class="text-[10px] text-gray-400">${new Date(postData.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-700 leading-relaxed break-words mb-3">${postData.text || ''}</p>
                        ${postData.image ? `<img src="${postData.image}" class="w-full rounded-xl max-h-72 object-cover border border-gray-50 shadow-3xs">` : ''}
                    `;
                    feedStream.appendChild(entry);
                });
            });
        }

        // --- REALTIME WEBRTC STREAM CONNECTION PROTO ---
        const overlay = document.getElementById('call-overlay');
        async function runCallEngine(hasVideo = true) {
            overlay.classList.remove('hidden');
            document.getElementById('call-target-name').innerText = activeChatUser.displayName;
            document.getElementById('call-status').innerText = "Streaming lines active...";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: hasVideo, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                console.warn("RTC Device allocation missing:", err);
                endCallChannel();
            }
        }

        function endCallChannel() {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            overlay.classList.add('hidden');
        }

        document.getElementById('btn-voice-call').addEventListener('click', () => runCallEngine(false));
        document.getElementById('btn-video-call').addEventListener('click', () => runCallEngine(true));
        document.getElementById('btn-end-call').addEventListener('click', endCallChannel);
    </script>
</body>

</html>
