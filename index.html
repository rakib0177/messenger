<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Premium Chat - Private 1-to-1</title>
    <!-- Google Fonts & Tailwind CSS for beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
        }

        /* Premium Glassmorphism Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="glass-panel w-full max-w-md rounded-3xl p-8 text-center shadow-2xl">
        <div
            class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 text-3xl font-bold border border-indigo-500/20">
            💬
        </div>
        <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">Welcome Back</h1>
        <p class="text-slate-400 mb-8 text-sm">Login with your Gmail account to start chatting privately in real-time.
        </p>

        <button id="btn-login"
            class="glass-button w-full text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg">
            <!-- Google Icon SVG -->
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path
                    d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.99 0-.74-.08-1.3-.175-1.854H12.24z" />
            </svg>
            Sign in with Google
        </button>
    </div>

    <!-- 2. MAIN CHAT INTERFACE (Hidden by default) -->
    <div id="chat-screen"
        class="glass-panel w-full max-w-5xl h-[85vh] rounded-3xl shadow-2xl flex hidden overflow-hidden">

        <!-- LEFT SIDEBAR: Registered Users List -->
        <div class="w-1/3 border-r border-white/10 flex flex-col bg-slate-900/20">
            <div class="p-4 border-b border-white/10 flex items-center justify-between bg-white/5">
                <div class="flex items-center gap-2">
                    <img id="user-avatar" src="" alt="Avatar"
                        class="w-8 h-8 rounded-full border border-indigo-500/30 object-cover">
                    <span id="user-display-name"
                        class="text-white font-semibold text-xs truncate max-w-[120px]">Loading...</span>
                </div>
                <button id="btn-logout"
                    class="text-[10px] font-medium text-slate-400 hover:text-rose-400 border border-white/10 hover:border-rose-500/30 px-2.5 py-1 rounded-xl transition-all bg-white/5">
                    Logout
                </button>
            </div>
            <div class="p-3 text-xs font-semibold text-indigo-400 uppercase tracking-wider">Active Users</div>
            <div id="users-list-container" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Users will be loaded here dynamically -->
            </div>
        </div>

        <!-- RIGHT SIDE: Chat Area Box -->
        <div class="flex-1 flex flex-col bg-slate-950/10">
            <!-- Active Chat Header -->
            <div id="chat-header-active"
                class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-white/5">
                <div class="flex items-center gap-3">
                    <img id="active-chat-avatar" src="https://via.placeholder.com/150" alt="Avatar"
                        class="w-10 h-10 rounded-full border border-white/10 object-cover">
                    <div>
                        <h2 id="active-chat-name" class="text-white font-semibold text-sm leading-none mb-1">Select a
                            user to start chat</h2>
                        <span id="active-chat-status" class="text-slate-400 text-xs flex items-center gap-1 hidden">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Private Chat
                        </span>
                    </div>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div id="no-chat-selected-placeholder"
                    class="h-full flex flex-col items-center justify-center text-slate-500 text-sm gap-2">
                    <span>💬</span>
                    <span>Please select a user from the sidebar to view messages.</span>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-area-container" class="p-4 border-t border-white/10 bg-white/5 hidden">
                <form id="chat-form" class="flex gap-2 items-center">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Type a private message..."
                        class="flex-1 bg-slate-900/40 border border-white/10 rounded-2xl px-5 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 text-sm transition-all">
                    <button type="submit"
                        class="glass-button text-white px-6 py-3.5 rounded-2xl font-semibold text-sm shadow-md flex items-center justify-center">
                        Send
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs (v9 Compat Mode for easy standalone setup) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        provider.setCustomParameters({ prompt: 'select_account' });

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userAvatar = document.getElementById('user-avatar');
        const userDisplayName = document.getElementById('user-display-name');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messagesContainer = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('users-list-container');

        const activeChatAvatar = document.getElementById('active-chat-avatar');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatStatus = document.getElementById('active-chat-status');
        const inputAreaContainer = document.getElementById('input-area-container');
        const noChatPlaceholder = document.getElementById('no-chat-selected-placeholder');

        let currentUser = null;
        let activeChatUserId = null;
        let messagesUnsubscribe = null;

        // Auth State Observer
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');

                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';
                userDisplayName.textContent = user.displayName;

                // Sync user info into users collection to make them visible to others
                db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    displayName: user.displayName,
                    photoURL: user.photoURL,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                loadUsersList();
            } else {
                currentUser = null;
                activeChatUserId = null;
                if (messagesUnsubscribe) messagesUnsubscribe();
                chatScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                resetChatArea();
            }
        });

        // Login Function
        btnLogin.addEventListener('click', () => {
            auth.signInWithPopup(provider).catch(error => {
                console.error("Popup Error, trying redirect mode... Details: ", error.message);
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
                    auth.signInWithRedirect(provider);
                } else {
                    alert("Login failed! Error Info: " + error.message);
                }
            });
        });

        // Logout Function
        btnLogout.addEventListener('click', () => {
            auth.signOut();
        });

        // Reset right side screen state
        function resetChatArea() {
            activeChatUserId = null;
            activeChatName.textContent = "Select a user to start chat";
            activeChatAvatar.src = "https://via.placeholder.com/150";
            activeChatStatus.classList.add('hidden');
            inputAreaContainer.classList.add('hidden');
            messagesContainer.innerHTML = `
                <div id="no-chat-selected-placeholder" class="h-full flex flex-col items-center justify-center text-slate-500 text-sm gap-2">
                    <span>💬</span>
                    <span>Please select a user from the sidebar to view messages.</span>
                </div>
            `;
        }

        // Load Registered Users List Realtime
        function loadUsersList() {
            db.collection('users').onSnapshot(snapshot => {
                usersListContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const userData = doc.data();
                    // Don't list myself in the user list
                    if (userData.uid === currentUser.uid) return;

                    const userRow = document.createElement('div');
                    userRow.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all hover:bg-white/5 ${activeChatUserId === userData.uid ? 'bg-white/10 border border-white/10' : ''}`;
                    userRow.innerHTML = `
                        <img src="${userData.photoURL || 'https://via.placeholder.com/150'}" alt="${userData.displayName}" class="w-9 h-9 rounded-full border border-white/10 object-cover">
                        <div class="flex-1 min-w-0">
                            <p class="text-white font-medium text-sm truncate">${userData.displayName}</p>
                            <p class="text-[10px] text-slate-400 truncate">Click to chat</p>
                        </div>
                    `;

                    userRow.addEventListener('click', () => {
                        selectUserForChat(userData);
                    });

                    usersListContainer.appendChild(userRow);
                });
            }, error => {
                console.error("Users list load error: ", error);
            });
        }

        // Select User and setup 1-to-1 Private room ID
        function selectUserForChat(targetUser) {
            activeChatUserId = targetUser.uid;
            activeChatName.textContent = targetUser.displayName;
            activeChatAvatar.src = targetUser.photoURL || 'https://via.placeholder.com/150';
            activeChatStatus.classList.remove('hidden');
            inputAreaContainer.classList.remove('hidden');

            // Refresh sidebar active styling states
            loadUsersList();

            // Generate unique chat room ID based on alphabetical sorting of UIDs
            // This ensures both users hit the exact same channel/room path
            const chatRoomId = currentUser.uid < targetUser.uid
                ? `${currentUser.uid}_${targetUser.uid}`
                : `${targetUser.uid}_${currentUser.uid}`;

            loadPrivateMessages(chatRoomId);
        }

        // Send Message Function (Scoped inside the specific private room)
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !activeChatUserId) return;

            const chatRoomId = currentUser.uid < activeChatUserId
                ? `${currentUser.uid}_${activeChatUserId}`
                : `${activeChatUserId}_${currentUser.uid}`;

            db.collection('rooms').document(chatRoomId).collection('messages').add({
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                senderId: currentUser.uid,
                receiverId: activeChatUserId,
                displayName: currentUser.displayName,
                photoURL: currentUser.photoURL
            }).catch(err => {
                console.error("Database Write Error: ", err);
                alert("Message send failed. Please make sure Firestore rules allow sub-collection writing.");
            });

            messageInput.value = '';
        });

        // Load Private Messages Realtime
        function loadPrivateMessages(chatRoomId) {
            // Unsubscribe previous message listener if exists
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('rooms').document(chatRoomId).collection('messages')
                .orderBy('createdAt', 'asc')
                .limitToLast(50)
                .onSnapshot(snapshot => {
                    messagesContainer.innerHTML = '';

                    if (snapshot.empty) {
                        messagesContainer.innerHTML = `
                            <div class="h-full flex flex-col items-center justify-center text-slate-500 text-xs">
                                🔒 Secure encryption loaded. Say hello to start this private conversion!
                            </div>
                        `;
                        return;
                    }

                    snapshot.forEach(doc => {
                        const message = doc.data();
                        renderMessage(message);
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, error => {
                    console.error("Private room access denied: ", error);
                    messagesContainer.innerHTML = `<div class="text-rose-400 p-4 text-center text-xs">Failed to load chat history. Check security rules.</div>`;
                });
        }

        // Render Message on UI
        function renderMessage(msg) {
            if (!msg.createdAt) return;
            const isMe = msg.senderId === currentUser.uid;
            const messageRow = document.createElement('div');
            messageRow.className = `flex items-end gap-2.5 ${isMe ? 'justify-end' : 'justify-start'}`;

            const avatarHtml = `<img src="${msg.photoURL || 'https://via.placeholder.com/150'}" alt="${msg.displayName}" class="w-7 h-7 rounded-full border border-white/10 object-cover">`;

            const messageContentHtml = `
                <div class="flex flex-col max-w-[70%] ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[10px] text-slate-400 px-1 mb-1">${msg.displayName}</span>
                    <div class="px-4 py-2.5 rounded-2xl text-sm ${isMe
                    ? 'bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-br-none shadow-md'
                    : 'bg-white/10 text-slate-200 rounded-bl-none border border-white/5'
                }">
                        ${escapeHTML(msg.text)}
                    </div>
                </div>
            `;

            messageRow.innerHTML = isMe ? (messageContentHtml + avatarHtml) : (avatarHtml + messageContentHtml);
            messagesContainer.appendChild(messageRow);
        }

        // Security Helper to prevent XSS injection
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>

</html>
