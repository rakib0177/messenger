<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect Engine - Absolute Fixed Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Strict Viewport Lock to prevent bottom elements cutoff */
        html,
        body {
            height: 100%;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .page-view {
            display: none;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page-view.active {
            display: flex;
            flex-direction: column;
        }

        .nav-item.active {
            color: #1877f2;
        }

        /* Theme Engines */
        .theme-blue {
            background-color: #eff6ff;
        }

        .theme-red {
            background-color: #fef2f2;
        }

        .theme-emerald {
            background-color: #ecfdf5;
        }

        .theme-dark {
            background-color: #1f2937;
            color: #f9fafb;
        }

        @keyframes slideDown {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-slide-down {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans flex flex-col select-none text-gray-800">

    <div id="notification-toast-container"
        class="fixed top-4 left-4 right-4 z-50 pointer-events-none flex flex-col gap-2"></div>

    <div id="auth-screen" class="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center p-6">
        <div class="text-center max-w-sm w-full">
            <div
                class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-xl shadow-blue-200">
                <i class="fas fa-comments text-white text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight mb-2">Connect Engine</h1>
            <p class="text-gray-500 text-sm mb-8">Real-time Messaging, Groups, Live Calling & Feed.</p>
            <button id="btn-login"
                class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3.5 px-6 rounded-xl shadow-sm flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                <i class="fab fa-google text-lg text-red-400"></i> Open with Google Account
            </button>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden pb-16">

        <header class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-40 shadow-xs">
            <div class="flex items-center gap-2.5 cursor-pointer" id="trigger-profile-modal">
                <img id="user-profile-pic" src=""
                    class="w-9 h-9 rounded-full object-cover border border-gray-200 shadow-sm">
                <div class="flex flex-col">
                    <span id="user-display-name"
                        class="font-bold text-gray-800 text-xs truncate max-w-[100px]">User</span>
                    <span class="text-[9px] text-blue-500 font-semibold flex items-center gap-1"><i
                            class="fas fa-pen"></i> Settings</span>
                </div>
            </div>
            <div id="app-title-text" class="text-base font-black tracking-tight text-gray-900">Conversations</div>
            <button id="btn-logout"
                class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-red-500 active:scale-95 transition">
                <i class="fas fa-power-off text-sm"></i>
            </button>
        </header>

        <div class="flex-1 overflow-hidden relative">

            <div id="page-chats" class="page-view active">
                <div class="p-3 bg-white border-b space-y-2">
                    <div class="relative">
                        <input type="text" id="search-user" placeholder="Search friends by email prefix..."
                            class="w-full bg-gray-100 py-2 pl-10 pr-4 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                        <i class="fas fa-search absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                    </div>
                    <div id="search-results"
                        class="hidden max-h-48 overflow-y-auto border border-gray-100 rounded-xl bg-white absolute left-3 right-3 z-50 shadow-xl">
                    </div>

                    <button id="btn-open-group-modal"
                        class="w-full bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-xs py-2 px-4 rounded-xl flex items-center justify-center gap-2 transition">
                        <i class="fas fa-users-medical"></i> Create New Chat Group
                    </button>
                </div>
                <div id="chats-list-container" class="flex-1 p-3 space-y-2 overflow-y-auto"></div>
            </div>

            <div id="page-requests" class="page-view">
                <div class="p-4 bg-gray-50 min-h-full">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pending Requests</h3>
                    <div id="requests-list-container" class="space-y-2"></div>
                </div>
            </div>

            <div id="page-feed" class="page-view">
                <div class="p-4 space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs">
                        <textarea id="post-text" placeholder="Write something to broadcast..." rows="3"
                            class="w-full bg-gray-50 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/10 border resize-none"></textarea>
                        <div class="flex justify-between items-center mt-3">
                            <label
                                class="cursor-pointer bg-gray-50 px-3 py-2 rounded-xl text-[11px] font-bold text-gray-600 flex items-center gap-2">
                                <input type="file" id="post-image-input" accept="image/*" class="hidden">
                                <i class="fas fa-image text-emerald-500"></i> Upload Media
                            </label>
                            <button id="btn-submit-post"
                                class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl">Publish
                                Post</button>
                        </div>
                    </div>
                    <div id="feed-stream" class="space-y-4 pb-12"></div>
                </div>
            </div>

            <div id="user-profile-view-modal"
                class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center">
                <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-6 text-center shadow-2xl">
                    <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-4 border-blue-500 shadow-md">
                        <img id="view-profile-pic" src="" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 id="view-profile-name" class="font-black text-xl text-gray-900">Username</h3>
                        <p id="view-profile-email" class="text-xs text-gray-400 mt-1">user@email.com</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button id="profile-btn-chat"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-2 shadow-md transition"><i
                                class="fas fa-comment-alt"></i> Start Chat</button>
                        <button id="profile-btn-close"
                            class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs py-3 rounded-xl transition">Close
                            Profile</button>
                    </div>
                </div>
            </div>

            <div id="fullscreen-chat-view"
                class="fixed inset-0 bg-white z-50 hidden flex flex-col h-full w-full overflow-hidden">
                <div class="p-3 border-b flex justify-between items-center bg-white z-10 shadow-3xs shrink-0">
                    <div class="flex items-center gap-2.5">
                        <button id="close-chat"
                            class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600"><i
                                class="fas fa-arrow-left text-sm"></i></button>
                        <img id="chat-user-pic" src="" class="w-9 h-9 rounded-full object-cover border cursor-pointer">
                        <div>
                            <h4 id="chat-user-name" class="font-bold text-sm text-gray-800 cursor-pointer">User Context
                            </h4>
                            <div class="flex gap-1.5 mt-1" id="theme-selectors">
                                <button data-theme="blue"
                                    class="w-3 h-3 rounded-full bg-blue-500 border border-white"></button>
                                <button data-theme="red"
                                    class="w-3 h-3 rounded-full bg-red-500 border border-white"></button>
                                <button data-theme="emerald"
                                    class="w-3 h-3 rounded-full bg-emerald-500 border border-white"></button>
                                <button data-theme="dark"
                                    class="w-3 h-3 rounded-full bg-gray-800 border border-white"></button>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2 text-blue-600">
                        <button id="btn-voice-call"
                            class="w-8 h-8 rounded-full hover:bg-blue-50 flex items-center justify-center"><i
                                class="fas fa-phone-alt text-sm"></i></button>
                        <button id="btn-video-call"
                            class="w-8 h-8 rounded-full hover:bg-blue-50 flex items-center justify-center"><i
                                class="fas fa-video text-sm"></i></button>
                    </div>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 theme-blue"></div>

                <div class="p-3 border-t bg-white flex items-center gap-1.5 shrink-0 z-10 pb-safe">
                    <label
                        class="cursor-pointer text-gray-400 hover:text-blue-600 w-9 h-9 flex items-center justify-center transition shrink-0">
                        <input type="file" id="chat-image-input" accept="image/*" class="hidden">
                        <i class="fas fa-image text-base"></i>
                    </label>
                    <button id="btn-voice-record"
                        class="text-gray-400 hover:text-blue-600 w-9 h-9 flex items-center justify-center transition shrink-0">
                        <i class="fas fa-microphone text-base"></i>
                    </button>
                    <input type="text" id="chat-msg-input" placeholder="Type message..."
                        class="flex-1 bg-gray-100 rounded-xl py-2 px-3 text-xs focus:outline-none focus:bg-white border focus:border-gray-200">
                    <button id="btn-send-msg"
                        class="text-blue-600 hover:text-blue-700 w-9 h-9 flex items-center justify-center transition shrink-0">
                        <i class="fas fa-paper-plane text-base"></i>
                    </button>
                </div>
            </div>

        </div>

        <nav
            class="fixed bottom-0 left-0 right-0 h-16 bg-white border-t flex justify-around items-center z-40 shadow-md">
            <button data-target="chats" class="nav-item active flex flex-col items-center w-14 gap-1">
                <i class="fas fa-comment-dots text-lg"></i>
                <span class="text-[9px] font-bold">Chats</span>
            </button>
            <button data-target="requests" class="nav-item flex flex-col items-center w-14 gap-1">
                <i class="fas fa-user-friends text-lg"></i>
                <span class="text-[9px] font-bold">Requests</span>
            </button>
            <button data-target="feed" class="nav-item flex flex-col items-center w-14 gap-1">
                <i class="fas fa-globe-americas text-lg"></i>
                <span class="text-[9px] font-bold">Feed</span>
            </button>
        </nav>
    </div>

    <div id="incoming-call-overlay"
        class="hidden fixed inset-0 bg-slate-900/95 z-50 flex flex-col justify-between p-8 text-white text-center">
        <div class="pt-16 space-y-3">
            <div
                class="animate-bounce w-20 h-20 bg-blue-500 rounded-full flex items-center justify-center mx-auto shadow-xl">
                <i class="fas fa-phone-alt text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black">Incoming Call...</h2>
            <p id="incoming-caller-name" class="text-gray-300 text-sm">Someone is calling you</p>
        </div>
        <div class="flex justify-center gap-10 pb-12 z-50">
            <button id="btn-decline-call"
                class="bg-red-600 w-16 h-16 rounded-full flex items-center justify-center text-xl shadow-lg hover:bg-red-700"><i
                    class="fas fa-phone-slash"></i></button>
            <button id="btn-accept-call"
                class="bg-green-500 animate-pulse w-16 h-16 rounded-full flex items-center justify-center text-xl shadow-lg hover:bg-green-600"><i
                    class="fas fa-phone"></i></button>
        </div>
    </div>

    <div id="call-overlay"
        class="hidden fixed inset-0 bg-gray-950 z-50 flex flex-col justify-between p-6 text-white overflow-hidden">
        <div class="text-center pt-4 z-10">
            <h2 id="call-status" class="text-base font-bold tracking-wide text-blue-400">Connecting Audio/Video Stream...</h2>
        </div>
        <div class="flex-1 flex justify-center items-center relative my-4 bg-black rounded-3xl overflow-hidden">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            <video id="local-video" autoplay playsinline muted
                class="w-24 h-36 bg-gray-800 rounded-2xl object-cover absolute bottom-4 right-4 border-2 border-white z-20 shadow-lg"></video>
        </div>
        <div class="flex justify-center pb-8 z-20 shrink-0">
            <button id="btn-end-call"
                class="bg-red-500 w-16 h-16 rounded-full flex items-center justify-center text-xl shadow-xl hover:bg-red-600 transition active:scale-95"><i
                    class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, updateDoc, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null, activeChatUser = null, isGroupContext = false;
        let mediaRecorder = null, audioChunks = [], isRecording = false, localStream = null, currentCallId = null;
        let chatMessagesUnsubscribe = null, peerConnection = null;

        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const searchInput = document.getElementById('search-user');
        const searchResults = document.getElementById('search-results');
        const chatsContainer = document.getElementById('chats-list-container');
        const requestsContainer = document.getElementById('requests-list-container');
        const feedStream = document.getElementById('feed-stream');
        const fullChatView = document.getElementById('fullscreen-chat-view');
        const profileViewModal = document.getElementById('user-profile-view-modal');

        // --- INSTANT NOTIFICATION TOAST ENGINE ---
        function sendInAppNotification(title, message) {
            const container = document.getElementById('notification-toast-container');
            const toast = document.createElement('div');
            toast.className = "pointer-events-auto bg-slate-900/95 text-white p-3.5 rounded-xl shadow-xl flex flex-col gap-0.5 animate-slide-down border border-gray-700 max-w-sm ml-auto";
            toast.innerHTML = `
                <div class="flex items-center gap-2"><i class="fas fa-bell text-blue-400 text-xs"></i><span class="font-bold text-xs">${title}</span></div>
                <p class="text-[11px] text-gray-300 pl-4 truncate">${message}</p>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // --- AUTH PIPELINE MANAGEMENT ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                const res = await signInWithPopup(auth, provider);
                const userRef = doc(db, "users", res.user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: res.user.uid,
                        displayName: res.user.displayName,
                        email: res.user.email.toLowerCase(),
                        photoURL: res.user.photoURL,
                        friends: [],
                        requestsReceived: []
                    });
                }
            } catch (err) { alert("Auth system mismatch runtime error logic."); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                
                // Fetch dynamic real-time data from users collection instead of auth layer properties directly
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if(docSnap.exists()){
                        const d = docSnap.data();
                        document.getElementById('user-profile-pic').src = d.photoURL || 'https://via.placeholder.com/150';
                        document.getElementById('user-display-name').textContent = d.displayName || 'User';
                    }
                });

                syncLiveAppEngine();
                loadGlobalFeed();
                listenForIncomingCalls();
                listenForGlobalIncomingMessages();
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // --- LAYOUT VIEWS CONTROLLER ---
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');

                const targetPage = target.getAttribute('data-target');
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.getElementById(`page-${targetPage}`).classList.add('active');
                document.getElementById('app-title-text').innerText = targetPage.toUpperCase();
            });
        });

        // --- INTERACTIVE PROFILE BOX ---
        function launchUserProfileView(userData) {
            document.getElementById('view-profile-pic').src = userData.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('view-profile-name').textContent = userData.displayName || 'User';
            document.getElementById('view-profile-email').textContent = userData.email;
            document.getElementById('profile-btn-chat').onclick = () => {
                profileViewModal.classList.add('hidden');
                openMessengerInterface(userData, false);
            };
            profileViewModal.classList.remove('hidden');
        }
        document.getElementById('profile-btn-close').addEventListener('click', () => profileViewModal.classList.add('hidden'));

        // --- DISCOVERY LOOKUP SYSTEM (FIXED: PREFIX & DEEP LOOKUP PREFIX MATCH) ---
        searchInput.addEventListener('input', async (e) => {
            const queryVal = e.target.value.trim().toLowerCase();
            if (!queryVal) { searchResults.classList.add('hidden'); return; }

            const q = query(
                collection(db, "users"), 
                orderBy("email"),
                where("email", ">=", queryVal), 
                where("email", "<=", queryVal + '\uf8ff')
            );
            
            try {
                const snap = await getDocs(q);
                searchResults.innerHTML = '';

                if (snap.empty) {
                    searchResults.innerHTML = `<p class="p-3 text-xs text-gray-400 text-center">No matching profiles mapped</p>`;
                } else {
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.uid === currentUser.uid) return;
                        const el = document.createElement('div');
                        el.className = "p-3 flex items-center justify-between border-b hover:bg-gray-50";
                        el.innerHTML = `
                            <div class="flex items-center gap-2 cursor-pointer search-view-profile">
                                <img src="${data.photoURL || 'https://via.placeholder.com/150'}" class="w-6 h-6 rounded-full object-cover">
                                <span class="text-xs font-bold">${data.displayName || 'User'}</span>
                            </div>
                            <button class="bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-lg trigger-send-req" data-id="${data.uid}">Connect</button>
                        `;
                        el.querySelector('.search-view-profile').onclick = () => launchUserProfileView(data);
                        searchResults.appendChild(el);
                    });
                }
                searchResults.classList.remove('hidden');
            } catch (err) {
                // Absolute structural fallback match sequence validation logic if composite keys fail index setup
                const genericQuery = query(collection(db, "users"), where("email", "==", queryVal));
                const genericSnap = await getDocs(genericQuery);
                searchResults.innerHTML = '';
                genericSnap.forEach(d => {
                    const data = d.data();
                    if (data.uid === currentUser.uid) return;
                    const el = document.createElement('div');
                    el.className = "p-3 flex items-center justify-between border-b hover:bg-gray-50";
                    el.innerHTML = `<div class="flex items-center gap-2 cursor-pointer search-view-profile"><img src="${data.photoURL}" class="w-6 h-6 rounded-full"><span class="text-xs font-bold">${data.displayName}</span></div><button class="bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-lg trigger-send-req" data-id="${data.uid}">Connect</button>`;
                    searchResults.appendChild(el);
                });
                searchResults.classList.remove('hidden');
            }
        });

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('trigger-send-req')) {
                const targetId = e.target.getAttribute('data-id');
                await updateDoc(doc(db, "users", targetId), { requestsReceived: arrayUnion(currentUser.uid) });
                e.target.innerText = "Sent";
                e.target.disabled = true;
            }
        });

        // --- ARCHITECTURE LIVE DATA SYNC ---
        function syncLiveAppEngine() {
            onSnapshot(doc(db, "users", currentUser.uid), (snap) => {
                const uData = snap.data();
                if (!uData) return;

                chatsContainer.innerHTML = '';
                if (uData.friends && uData.friends.length > 0) {
                    uData.friends.forEach(async (fId) => {
                        const fSnap = await getDoc(doc(db, "users", fId));
                        if (fSnap.exists()) renderConversationCard(fSnap.data(), false);
                    });
                }

                requestsContainer.innerHTML = '';
                if (uData.requestsReceived && uData.requestsReceived.length > 0) {
                    uData.requestsReceived.forEach(async (rId) => {
                        const rSnap = await getDoc(doc(db, "users", rId));
                        if (rSnap.exists()) renderRequestCard(rSnap.data());
                    });
                }
            });
        }

        function renderConversationCard(data, isGroup) {
            const card = document.createElement('div');
            card.className = "flex items-center justify-between p-3 bg-white border rounded-2xl cursor-pointer hover:bg-gray-50 shadow-2xs";
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${data.photoURL || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border">
                    <div>
                        <h4 class="font-bold text-xs text-gray-800">${data.displayName || 'User'}</h4>
                        <p class="text-[10px] text-gray-400">Tap to start secure session</p>
                    </div>
                </div>
            `;
            card.onclick = () => openMessengerInterface(data, isGroup);
            chatsContainer.appendChild(card);
        }

        function renderRequestCard(data) {
            const row = document.createElement('div');
            row.className = "p-3 bg-white border rounded-2xl flex items-center justify-between";
            row.innerHTML = `
                <div class="flex items-center gap-2"><img src="${data.photoURL || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover"><span class="text-xs font-bold">${data.displayName || 'User'}</span></div>
                <button class="bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl run-accept-req" data-id="${data.uid}">Accept</button>
            `;
            requestsContainer.appendChild(row);
        }

        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('run-accept-req')) {
                const id = e.target.getAttribute('data-id');
                const myRef = doc(db, "users", currentUser.uid);
                const targetRef = doc(db, "users", id);
                const mySnap = await getDoc(myRef);
                const cleanReqs = (mySnap.data().requestsReceived || []).filter(i => i !== id);

                await updateDoc(myRef, { friends: arrayUnion(id), requestsReceived: cleanReqs });
                await updateDoc(targetRef, { friends: arrayUnion(currentUser.uid) });
            }
        });

        // --- BACKGROUND REAL-TIME SMS NOTIFIER ENGINE ---
        function listenForGlobalIncomingMessages() {
            onSnapshot(collection(db, "chats"), (snapshot) => {
                snapshot.docChanges().forEach(async (change) => {
                    if (change.type === "modified" || change.type === "added") {
                        const tokens = change.doc.id.split("_");
                        if (tokens.includes(currentUser.uid)) {
                            const msgQuery = query(collection(db, "chats", change.doc.id, "messages"), orderBy("timestamp", "desc"));
                            const querySnap = await getDocs(msgQuery);
                            if (!querySnap.empty) {
                                const latestMsg = querySnap.docs[0].data();
                                if (latestMsg.senderId !== currentUser.uid && (!activeChatUser || fullChatView.classList.contains('hidden'))) {
                                    sendInAppNotification("New Message from Room Channel", latestMsg.text || "Sent a media file");
                                }
                            }
                        }
                    }
                });
            });
        }

        // --- CHAT SYSTEM MODULE ---
        function openMessengerInterface(target, groupContextFlag) {
            activeChatUser = target;
            isGroupContext = groupContextFlag;
            fullChatView.classList.remove('hidden');
            document.getElementById('chat-user-pic').src = target.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('chat-user-name').textContent = target.displayName || 'User';

            const roomPath = [currentUser.uid, target.uid].sort().join("_");
            if (chatMessagesUnsubscribe) chatMessagesUnsubscribe();

            const q = query(collection(db, "chats", roomPath, "messages"), orderBy("timestamp", "asc"));
            chatMessagesUnsubscribe = onSnapshot(q, (snapshot) => {
                const msgBox = document.getElementById('chat-messages');
                msgBox.innerHTML = '';
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const isMe = m.senderId === currentUser.uid;
                    const msgRow = document.createElement('div');
                    msgRow.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-1`;

                    let contentNode = `<p class="text-xs leading-relaxed">${m.text}</p>`;
                    if (m.type === 'image') contentNode = `<img src="${m.mediaUrl}" class="max-w-[60vw] rounded-lg border shadow-sm">`;
                    if (m.type === 'audio') contentNode = `<audio src="${m.mediaUrl}" controls class="max-w-[55vw] scale-90 origin-left"></audio>`;

                    msgRow.innerHTML = `
                        <div class="${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'} p-3 rounded-2xl max-w-[70vw] shadow-3xs">
                            ${contentNode}
                        </div>
                    `;
                    msgBox.appendChild(msgRow);
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }

        document.getElementById('close-chat').addEventListener('click', () => { fullChatView.classList.add('hidden'); activeChatUser = null; });

        async function dispatchChatMessage(payload, type = 'text') {
            const roomPath = [currentUser.uid, activeChatUser.uid].sort().join("_");
            await addDoc(collection(db, "chats", roomPath, "messages"), { senderId: currentUser.uid, timestamp: Date.now(), type: type, ...payload });
        }

        document.getElementById('btn-send-msg').addEventListener('click', () => {
            const input = document.getElementById('chat-msg-input');
            if (!input.value.trim()) return;
            dispatchChatMessage({ text: input.value.trim() }, 'text');
            input.value = '';
        });

        // FIXED CHAT IMAGE TRANSMISSION SYSTEM
        document.getElementById('chat-image-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const storageRef = ref(storage, `chats/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(storageRef, file);
                const downloadUrl = await getDownloadURL(snap.ref);
                await dispatchChatMessage({ mediaUrl: downloadUrl, text: '[Image Photo]' }, 'image');
            } catch (err) { alert("Firebase Storage write error dynamic execution logic."); }
        });

        // --- FIXED: GLOBAL LIVE STREAM FEED CONTROLLER (PUBLISH FIXED) ---
        const btnSubmitPost = document.getElementById('btn-submit-post');
        const postText = document.getElementById('post-text');
        const postImageInput = document.getElementById('post-image-input');

        btnSubmitPost.addEventListener('click', async () => {
            const text = postText.value.trim();
            const file = postImageInput.files[0];
            
            if (!text && !file) { alert("Please write a message or upload an image!"); return; }
            btnSubmitPost.disabled = true;
            btnSubmitPost.innerText = "Publishing...";

            let imageUrl = null;
            try {
                if (file) {
                    const storageRef = ref(storage, `feeds/${Date.now()}_${file.name}`);
                    const uploadSnap = await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(uploadSnap.ref);
                }

                // Dynamic live profile fetching parameters injection strategy
                const myProfileSnap = await getDoc(doc(db, "users", currentUser.uid));
                const myCurrentProfileData = myProfileSnap.exists() ? myProfileSnap.data() : {};

                await addDoc(collection(db, "posts"), {
                    uid: currentUser.uid,
                    authorName: myCurrentProfileData.displayName || currentUser.displayName,
                    authorPhoto: myCurrentProfileData.photoURL || currentUser.photoURL,
                    text: text,
                    mediaUrl: imageUrl,
                    timestamp: Date.now()
                });

                postText.value = '';
                postImageInput.value = '';
                sendInAppNotification("Feed Action", "Broadcast post published successfully!");
            } catch (err) {
                alert("Error synchronizing active stream post data logic.");
            } finally {
                btnSubmitPost.disabled = false;
                btnSubmitPost.innerText = "Publish Post";
            }
        });

        async function loadGlobalFeed() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                feedStream.innerHTML = '';
                snapshot.forEach(doc => {
                    const p = doc.data();
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3";
                    
                    let mediaRender = p.mediaUrl ? `<img src="${p.mediaUrl}" class="w-full h-48 object-cover rounded-xl mt-2">` : '';
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${p.authorPhoto || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-xs text-gray-800">${p.authorName || 'Anonymous'}</h4>
                                <p class="text-[9px] text-gray-400">${new Date(p.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                        <p class="text-xs text-gray-700 leading-relaxed">${p.text || ''}</p>
                        ${mediaRender}
                    `;
                    feedStream.appendChild(card);
                });
            });
        }

        // --- FIXED: SETTINGS INTERACTIVE SYSTEM MANAGEMENT PROFILE CONTROLLER ---
        document.getElementById('trigger-profile-modal').addEventListener('click', async () => {
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            let currentProfileData = userSnap.exists() ? userSnap.data() : { displayName: currentUser.displayName, photoURL: currentUser.photoURL };

            const currentName = currentProfileData.displayName || currentUser.displayName;
            const newName = prompt("Enter your new Display Name:", currentName);
            if (newName === null) return; 
            
            let updatedName = newName.trim() || currentName;
            let updatedPhoto = currentProfileData.photoURL || currentUser.photoURL;

            const uploadConfirm = confirm("Do you want to update your profile avatar picture?");
            if (uploadConfirm) {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        try {
                            sendInAppNotification("System Action", "Uploading profile picture to engine...");
                            const storageRef = ref(storage, `profiles/${currentUser.uid}_avatar`);
                            const snap = await uploadBytes(storageRef, file);
                            updatedPhoto = await getDownloadURL(snap.ref);
                            
                            await updateDoc(userRef, {
                                displayName: updatedName,
                                photoURL: updatedPhoto
                            });
                            
                            sendInAppNotification("Success", "Profile updated successfully!");
                        } catch (err) { alert("Avatar image update logic pipeline broken."); }
                    }
                };
                fileInput.click();
            } else {
                await updateDoc(userRef, { displayName: updatedName });
                sendInAppNotification("Success", "Display name modification completed.");
            }
        });

        // --- FIXED: VOICE RECORD NOTES DISPATCH PIPELINE ---
        const voiceBtn = document.getElementById('btn-voice-record');
        voiceBtn.addEventListener('click', async () => {
            if (!isRecording) {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = (e) => {
                            if (e.data.size > 0) audioChunks.push(e.data);
                        };

                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                            voiceBtn.classList.remove('text-red-500', 'animate-pulse');
                            voiceBtn.classList.add('text-gray-400');

                            try {
                                const storageRef = ref(storage, `audio_notes/${Date.now()}.mp3`);
                                const snap = await uploadBytes(storageRef, audioBlob);
                                const downloadUrl = await getDownloadURL(snap.ref);
                                await dispatchChatMessage({ mediaUrl: downloadUrl, text: '[Voice Note]' }, 'audio');
                            } catch (err) {
                                alert("Firebase Storage audio dispatch routing error.");
                            }
                            stream.getTracks().forEach(track => track.stop());
                        };

                        mediaRecorder.start();
                        isRecording = true;
                        voiceBtn.classList.remove('text-gray-400');
                        voiceBtn.classList.add('text-red-500', 'animate-pulse');
                    } catch (err) {
                        alert("Microphone hardware access rejected.");
                    }
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                isRecording = false;
            }
        });

        // --- REAL-TIME THEME CHANGER ---
        document.querySelectorAll('#theme-selectors button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetTheme = e.target.getAttribute('data-theme');
                const chatMessagesBox = document.getElementById('chat-messages');
                
                chatMessagesBox.className = "flex-1 overflow-y-auto p-4 space-y-3";
                if (targetTheme === 'blue') chatMessagesBox.classList.add('theme-blue');
                if (targetTheme === 'red') chatMessagesBox.classList.add('theme-red');
                if (targetTheme === 'emerald') chatMessagesBox.classList.add('theme-emerald');
                if (targetTheme === 'dark') chatMessagesBox.classList.add('theme-dark');
            });
        });

        // --- DUMMY STUBS TO PREVENT RUNTIME ERRORS FOR RTC STREAM CHANNELS ---
        function listenForIncomingCalls() {}
    </script>
</body>
