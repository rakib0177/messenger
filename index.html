<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>private messenger</title>
    <!-- Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="flex items-center justify-center p-0 md:p-4">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="glass-panel w-full max-w-md rounded-3xl p-8 text-center shadow-2xl mx-4">
        <div
            class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 text-3xl font-bold border border-indigo-500/20">
            💬</div>
        <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">Welcome Back</h1>
        <p class="text-slate-400 mb-8 text-sm">Login with your Gmail account to start chatting in real-time.</p>
        <button id="btn-login"
            class="glass-button w-full text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path
                    d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.99 0-.74-.08-1.3-.175-1.854H12.24z" />
            </svg>
            Sign in with Google
        </button>
    </div>

    <!-- 2. MAIN CHAT INTERFACE -->
    <div id="chat-screen"
        class="glass-panel w-full max-w-5xl h-screen md:h-[85vh] md:rounded-3xl shadow-2xl flex hidden overflow-hidden relative">

        <!-- LEFT SIDEBAR (CHATS & GROUPS MENU) -->
        <div id="sidebar-panel"
            class="absolute inset-0 z-20 md:relative md:inset-auto w-full md:w-1/3 border-r border-white/10 flex flex-col bg-slate-900 md:bg-slate-900/20 transition-transform duration-300 transform -translate-x-full md:translate-x-0 hidden md:flex">
            <div class="p-4 border-b border-white/10 bg-white/5 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 min-w-0">
                        <img id="user-avatar" src="" alt="Avatar"
                            class="w-8 h-8 rounded-full border border-indigo-500/30 object-cover shrink-0">
                        <span id="user-display-name"
                            class="text-white font-semibold text-xs truncate max-w-[120px]">Loading...</span>
                        <button id="btn-edit-profile" title="Change Name/Avatar"
                            class="text-slate-400 hover:text-white text-xs">⚙️</button>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button id="btn-close-sidebar"
                            class="md:hidden text-[10px] text-slate-400 border border-white/10 px-2 py-1 rounded-xl bg-white/5">Back</button>
                        <button id="btn-logout"
                            class="text-[10px] font-medium text-slate-400 hover:text-rose-400 border border-white/10 hover:border-rose-500/30 px-2 py-1 rounded-xl transition-all bg-white/5">Logout</button>
                    </div>
                </div>
                <div class="bg-black/20 rounded-xl p-2.5 text-left border border-white/5">
                    <p
                        class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 mb-1 flex justify-between items-center">
                        <span>My Story / Bio</span>
                        <button id="btn-edit-bio"
                            class="text-white bg-indigo-500/30 hover:bg-indigo-500/50 px-1.5 py-0.5 rounded text-[9px] normal-case transition-all">Edit</button>
                    </p>
                    <p id="user-bio-text" class="text-xs text-slate-300 italic line-clamp-2">No bio set yet.</p>
                </div>
                <!-- Group Creation Button -->
                <button id="btn-create-group"
                    class="w-full bg-indigo-600/40 hover:bg-indigo-600/60 text-white text-xs py-2 px-3 rounded-xl border border-indigo-500/30 transition-all font-medium">
                    ➕ Create 4-5 Member Group
                </button>
            </div>

            <div class="p-3 text-xs font-semibold text-indigo-400 uppercase tracking-wider">Chats & Groups</div>
            <div id="users-list-container" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </div>

        <!-- RIGHT SIDE: Chat Area -->
        <div id="chat-main-area"
            class="flex-1 flex flex-col bg-slate-950/10 w-full min-w-0 transition-all duration-300">
            <!-- Active Chat Header -->
            <div id="chat-header-active"
                class="px-4 md:px-6 py-3 border-b border-white/10 flex flex-col bg-white/5 gap-2 shrink-0">
                <div class="flex items-center justify-between min-w-0">
                    <div class="flex items-center gap-3 min-w-0 cursor-pointer" id="active-chat-profile-trigger"
                        title="Click to view profile">
                        <img id="active-chat-avatar" src="https://via.placeholder.com/150" alt="Avatar"
                            class="w-10 h-10 rounded-full border border-white/10 object-cover hover:scale-105 transition-transform">
                        <div class="min-w-0">
                            <h2 id="active-chat-name"
                                class="text-white font-semibold text-sm leading-none mb-1 truncate">Select a user/group
                            </h2>
                            <span id="active-chat-status" class="text-slate-400 text-xs flex items-center gap-1 hidden">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Chat
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- Calling Buttons -->
                        <div id="call-buttons-container" class="flex items-center gap-1 mr-2 hidden">
                            <button id="btn-audio-call" title="Audio Call"
                                class="p-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl hover:bg-emerald-500/40 transition-all text-xs">📞</button>
                            <button id="btn-video-call" title="Video Call"
                                class="p-2 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-xl hover:bg-indigo-500/40 transition-all text-xs">📹</button>
                        </div>
                        <!-- Theme/Color Selector -->
                        <select id="chat-color-picker"
                            class="bg-slate-800 text-white text-xs px-2 py-1.5 rounded-xl border border-white/10 focus:outline-none hidden">
                            <option value="transparent">Default Theme</option>
                            <option value="rgba(239, 68, 68, 0.2)">🔴 Red Theme</option>
                            <option value="rgba(0, 0, 0, 0.6)">⚫ Black Theme</option>
                            <option value="rgba(59, 130, 246, 0.2)">🔵 Blue Theme</option>
                            <option value="rgba(234, 179, 8, 0.2)">🟡 Yellow Theme</option>
                            <option value="rgba(236, 72, 153, 0.2)">💗 Pink Theme</option>
                        </select>
                        <button id="btn-clear-history"
                            class="text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 px-2 py-1.5 rounded-xl hidden">🗑️
                            Clear All</button>
                        <button id="btn-toggle-users"
                            class="glass-button text-xs text-white px-3 py-2 rounded-xl font-medium shadow-md">👥
                            Menu</button>
                    </div>
                </div>
                <div id="active-chat-bio-container"
                    class="hidden text-left bg-indigo-500/5 rounded-xl px-3 py-1.5 border border-indigo-500/10 flex items-start gap-1.5">
                    <span class="text-xs">📝</span>
                    <p id="active-chat-bio" class="text-xs text-slate-300 italic truncate"></p>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                <div id="no-chat-selected-placeholder"
                    class="h-full flex flex-col items-center justify-center text-slate-500 text-sm gap-2">
                    <span>💬</span>
                    <span>Please select a chat or group to view messages.</span>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-area-container" class="p-4 border-t border-white/10 bg-white/5 hidden shrink-0">
                <form id="chat-form" class="flex gap-2 items-center">
                    <input type="file" id="image-attachment-input" accept="image/*" class="hidden">
                    <button type="button" id="btn-attach-image" title="Send a Photo"
                        class="w-11 h-11 rounded-2xl bg-slate-800 border border-white/10 hover:border-indigo-500/40 text-lg flex items-center justify-center text-slate-300 transition-all shrink-0">🖼️</button>
                    <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..."
                        class="flex-1 bg-slate-900/40 border border-white/10 rounded-2xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 text-sm transition-all">
                    <button type="submit"
                        class="glass-button text-white px-5 py-3 rounded-2xl font-semibold text-sm shadow-md flex items-center justify-center shrink-0">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- PROFILE VIEW POPUP MODAL -->
    <div id="profile-modal"
        class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4 backdrop-blur-md">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center relative text-white">
            <button id="btn-close-profile-modal"
                class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>
            <img id="modal-profile-img" src=""
                class="w-28 h-28 rounded-full mx-auto object-cover border-2 border-indigo-500/50 mb-4 shadow-xl">
            <h3 id="modal-profile-name" class="text-xl font-bold tracking-tight mb-1">Name</h3>
            <p id="modal-profile-type" class="text-indigo-400 font-medium text-xs mb-4">User Profile</p>
            <div class="bg-black/30 p-3 rounded-xl border border-white/5 text-left">
                <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider block mb-1">About /
                    Biography</span>
                <p id="modal-profile-bio" class="text-sm text-slate-200 italic break-words">No Bio</p>
            </div>
        </div>
    </div>

    <!-- CALL INTERFACE MODAL -->
    <div id="call-modal"
        class="fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center hidden text-white p-4 animate-fade-in">
        <div class="text-center space-y-6 max-w-sm w-full">
            <div class="relative inline-block">
                <img id="call-user-img" src="https://via.placeholder.com/150"
                    class="w-32 h-32 rounded-full object-cover border-4 border-indigo-500 animate-pulse mx-auto">
                <div class="absolute bottom-1 right-2 bg-emerald-500 w-5 h-5 rounded-full border-4 border-slate-950">
                </div>
            </div>
            <div>
                <h3 id="call-user-name" class="text-2xl font-bold">User Name</h3>
                <p id="call-status-text" class="text-indigo-400 text-sm mt-1 animate-bounce">Ringing...</p>
            </div>
            <div class="flex justify-center gap-6 pt-8">
                <button id="btn-end-call"
                    class="w-14 h-14 bg-rose-500 hover:bg-rose-600 rounded-full flex items-center justify-center text-xl shadow-lg transition-transform hover:scale-110">🤙</button>
            </div>
        </div>
    </div>

    <!-- Firebase Legacy SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        // HTML5 Audio Context Setup for Notification Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNotificationSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 Note
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5 Note
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { console.log("Audio play blocked"); }
        }

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const sidebarPanel = document.getElementById('sidebar-panel');
        const chatMainArea = document.getElementById('chat-main-area');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const btnToggleUsers = document.getElementById('btn-toggle-users');
        const btnCloseSidebar = document.getElementById('btn-close-sidebar');
        const btnEditBio = document.getElementById('btn-edit-bio');
        const btnEditProfile = document.getElementById('btn-edit-profile');
        const btnCreateGroup = document.getElementById('btn-create-group');
        const btnClearHistory = document.getElementById('btn-clear-history');
        const chatColorPicker = document.getElementById('chat-color-picker');
        const userAvatar = document.getElementById('user-avatar');
        const userDisplayName = document.getElementById('user-display-name');
        const userBioText = document.getElementById('user-bio-text');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageAttachmentInput = document.getElementById('image-attachment-input');
        const btnAttachImage = document.getElementById('btn-attach-image');
        const messagesContainer = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('users-list-container');
        const activeChatAvatar = document.getElementById('active-chat-avatar');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatStatus = document.getElementById('active-chat-status');
        const activeChatBioContainer = document.getElementById('active-chat-bio-container');
        const activeChatBio = document.getElementById('active-chat-bio');
        const inputAreaContainer = document.getElementById('input-area-container');
        const callButtonsContainer = document.getElementById('call-buttons-container');
        const btnAudioCall = document.getElementById('btn-audio-call');
        const btnVideoCall = document.getElementById('btn-video-call');

        // Modal Modals
        const profileModal = document.getElementById('profile-modal');
        const btnCloseProfileModal = document.getElementById('btn-close-profile-modal');
        const modalProfileImg = document.getElementById('modal-profile-img');
        const modalProfileName = document.getElementById('modal-profile-name');
        const modalProfileBio = document.getElementById('modal-profile-bio');
        const modalProfileType = document.getElementById('modal-profile-type');
        const activeChatProfileTrigger = document.getElementById('active-chat-profile-trigger');

        const callModal = document.getElementById('call-modal');
        const callUserImg = document.getElementById('call-user-img');
        const callUserName = document.getElementById('call-user-name');
        const callStatusText = document.getElementById('call-status-text');
        const btnEndCall = document.getElementById('btn-end-call');

        let currentUser = null;
        let activeChatUserId = null;
        let isGroupChat = false;
        let currentRoomId = null;
        let messagesUnsubscribe = null;
        let allUsersCache = [];
        let roomLastMessageTimes = {};
        let initialLoadDone = false;

        // Auth Observer
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';
                userDisplayName.textContent = user.displayName;

                db.collection('users').doc(user.uid).get().then(docSnapshot => {
                    let defaultBio = "Hello! I am using Realtime Premium Chat.";
                    if (docSnapshot.exists && docSnapshot.data().bio) {
                        defaultBio = docSnapshot.data().bio;
                    }
                    userBioText.textContent = defaultBio;
                    db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        displayName: user.displayName,
                        photoURL: user.photoURL,
                        bio: defaultBio,
                        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                });
                loadChatsAndGroups();
            } else {
                currentUser = null;
                if (messagesUnsubscribe) messagesUnsubscribe();
                chatScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                resetChatArea();
            }
        });

        btnLogin.addEventListener('click', () => {
            auth.signInWithPopup(provider).catch(error => {
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
                    auth.signInWithRedirect(provider);
                } else { alert("Login failed! " + error.message); }
            });
        });

        btnLogout.addEventListener('click', () => auth.signOut());

        btnEditBio.addEventListener('click', () => {
            const currentBio = userBioText.textContent;
            const newBio = prompt("Write your short Bio:", currentBio);
            if (newBio !== null && newBio.trim() !== "") {
                userBioText.textContent = newBio.trim();
                db.collection('users').doc(currentUser.uid).update({ bio: newBio.trim() });
            }
        });

        // Edit Profile Name and Picture URL Function
        btnEditProfile.addEventListener('click', () => {
            const newName = prompt("Enter new display name:", currentUser.displayName);
            if (!newName || newName.trim() === "") return;
            const newPhotoURL = prompt("Enter profile picture URL:", currentUser.photoURL || "");

            if (newName.trim() !== "") {
                currentUser.updateProfile({
                    displayName: newName.trim(),
                    photoURL: newPhotoURL ? newPhotoURL.trim() : currentUser.photoURL
                }).then(() => {
                    userDisplayName.textContent = newName.trim();
                    if (newPhotoURL) userAvatar.src = newPhotoURL.trim();
                    db.collection('users').doc(currentUser.uid).update({
                        displayName: newName.trim(),
                        photoURL: newPhotoURL ? newPhotoURL.trim() : currentUser.photoURL
                    });
                    alert("Profile updated successfully!");
                }).catch(err => alert("Error updating profile: " + err.message));
            }
        });

        // Background Color Picker
        chatColorPicker.addEventListener('change', (e) => {
            chatMainArea.style.backgroundColor = e.target.value;
        });

        // Image Attachment
        btnAttachImage.addEventListener('click', () => imageAttachmentInput.click());
        imageAttachmentInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !currentRoomId) return;
            if (!file.type.startsWith('image/')) return alert('Please select an image file.');
            if (file.size > 1000000) return alert('Image size must be under 1MB.');

            const reader = new FileReader();
            reader.onload = function (event) {
                sendChatMessage(null, event.target.result);
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        // Create 4-5 Member Group
        btnCreateGroup.addEventListener('click', () => {
            if (allUsersCache.length < 3) {
                return alert("Not enough users registered to create a 4-5 member group.");
            }
            let userOptions = allUsersCache.map((u, index) => `${index + 1}. ${u.displayName}`).join('\n');
            let selections = prompt(`Enter user numbers separated by comma (e.g., 1,2,3) to add to group:\n\n${userOptions}`);

            if (!selections) return;
            let indices = selections.split(',').map(num => parseInt(num.trim()) - 1);
            let selectedMembers = [currentUser.uid];
            let memberNames = [currentUser.displayName];

            indices.forEach(idx => {
                if (allUsersCache[idx]) {
                    selectedMembers.push(allUsersCache[idx].uid);
                    memberNames.push(allUsersCache[idx].displayName);
                }
            });

            if (selectedMembers.length < 3 || selectedMembers.length > 6) {
                return alert("Group must have between 3 to 5 extra members (Total 4-6 members).");
            }

            let groupName = prompt("Enter a name for your new Group:");
            if (!groupName || groupName.trim() === "") groupName = "Premium Power Group";

            db.collection('rooms').add({
                isGroup: true,
                groupName: groupName.trim(),
                members: selectedMembers,
                memberNames: memberNames,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: currentUser.uid
            }).then(() => alert("Group Created Successfully!"));
        });

        // Profile View Logic
        activeChatProfileTrigger.addEventListener('click', () => {
            if (!currentRoomId) return;
            modalProfileName.textContent = activeChatName.textContent;
            modalProfileImg.src = activeChatAvatar.src;
            if (isGroupChat) {
                modalProfileType.textContent = "Group Conversation";
                modalProfileBio.textContent = activeChatBio.textContent || "No summary config available for this group.";
            } else {
                modalProfileType.textContent = "Private Contact";
                modalProfileBio.textContent = activeChatBio.textContent || "No description / bio added by user.";
            }
            profileModal.classList.remove('hidden');
        });
        btnCloseProfileModal.addEventListener('click', () => profileModal.classList.add('hidden'));

        // Calling UI Trigger Simulation
        function runCallSimulation(type) {
            callUserName.textContent = activeChatName.textContent;
            callUserImg.src = activeChatAvatar.src;
            callStatusText.textContent = `Establishing ${type} Connection...`;
            callModal.classList.remove('hidden');

            setTimeout(() => {
                callStatusText.textContent = `On Live ${type} Call (Encrypted)`;
            }, 2500);
        }
        btnAudioCall.addEventListener('click', () => runCallSimulation('Audio'));
        btnVideoCall.addEventListener('click', () => runCallSimulation('Video'));
        btnEndCall.addEventListener('click', () => callModal.add(callModal.classList.add('hidden')));

        // Realtime loading of Users and Groups (Unified Fix)
        function loadChatsAndGroups() {
            db.collection('users').onSnapshot(userSnapshot => {
                allUsersCache = [];
                userSnapshot.forEach(doc => {
                    if (doc.data().uid !== currentUser.uid) {
                        allUsersCache.push(doc.data());
                    }
                });

                db.collection('rooms').where('isGroup', '==', true).onSnapshot(groupSnapshot => {
                    renderSidebar(allUsersCache, groupSnapshot);
                    listenToAllIncomingMessages(allUsersCache, groupSnapshot);
                });
            }, error => {
                console.error("Error loading users: ", error);
            });
        }

        // Monitoring incoming messages across all conversations for sound alerts and highlights
        function listenToAllIncomingMessages(users, groupSnapshot) {
            // Monitor standard room channels
            users.forEach(u => {
                const rId = currentUser.uid < u.uid ? `${currentUser.uid}_${u.uid}` : `${u.uid}_${currentUser.uid}`;
                attachRoomListener(rId);
            });
            // Monitor group chat channels
            groupSnapshot.forEach(gDoc => {
                attachRoomListener(gDoc.id);
            });
            setTimeout(() => { initialLoadDone = true; }, 4000);
        }

        function attachRoomListener(rId) {
            if (window[rId + '_listener']) return;
            window[rId + '_listener'] = true;

            db.collection('rooms').doc(rId).collection('messages')
                .orderBy('createdAt', 'desc').limit(1)
                .onSnapshot(snap => {
                    if (!snap.empty) {
                        const mDoc = snap.docs[0].data();
                        const mTime = mDoc.createdAt ? mDoc.createdAt.toMillis() : null;

                        if (mTime && roomLastMessageTimes[rId] && mTime > roomLastMessageTimes[rId]) {
                            if (mDoc.senderId !== currentUser.uid) {
                                playNotificationSound();
                                if (currentRoomId !== rId) {
                                    const badge = document.getElementById(`badge-${rId}`);
                                    if (badge) badge.classList.remove('hidden');
                                }
                            }
                        }
                        if (mTime) roomLastMessageTimes[rId] = mTime;
                    }
                });
        }

        function renderSidebar(users, groupSnapshot) {
            usersListContainer.innerHTML = '';

            // 1. Render Groups First
            groupSnapshot.forEach(doc => {
                const groupData = doc.data();
                if (!groupData.members.includes(currentUser.uid)) return;
                const rId = doc.id;

                const row = document.createElement('div');
                row.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all hover:bg-indigo-500/10 border border-indigo-500/20 mb-1 bg-indigo-950/20 relative`;
                row.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white text-lg font-bold shrink-0">👥</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-semibold text-sm truncate">${groupData.groupName}</p>
                        <p class="text-[10px] text-indigo-300 truncate">Group: ${groupData.memberNames.join(', ')}</p>
                    </div>
                    <span id="badge-${rId}" class="w-2.5 h-2.5 rounded-full bg-rose-500 border border-slate-900 absolute right-3 hidden animate-ping"></span>
                `;
                row.addEventListener('click', () => {
                    isGroupChat = true;
                    activeChatUserId = null;
                    currentRoomId = rId;
                    const b = document.getElementById(`badge-${rId}`);
                    if (b) b.classList.add('hidden');
                    setupChatUI(groupData.groupName, 'https://via.placeholder.com/150', `Members: ${groupData.memberNames.length}`);
                    loadMessages();
                });
                usersListContainer.appendChild(row);
            });

            // 2. Render Individual Users
            users.forEach(userData => {
                const rId = currentUser.uid < userData.uid ? `${currentUser.uid}_${userData.uid}` : `${userData.uid}_${currentUser.uid}`;
                const row = document.createElement('div');
                row.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all hover:bg-white/5 relative`;
                row.innerHTML = `
                    <img src="${userData.photoURL || 'https://via.placeholder.com/150'}" class="w-9 h-9 rounded-full border border-white/10 object-cover shrink-0">
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-medium text-sm truncate">${userData.displayName}</p>
                        <p class="text-[10px] text-slate-400 truncate">${userData.bio || 'Click to chat'}</p>
                    </div>
                    <span id="badge-${rId}" class="w-2.5 h-2.5 rounded-full bg-rose-500 border border-slate-900 absolute right-3 hidden animate-bounce"></span>
                `;
                row.addEventListener('click', () => {
                    isGroupChat = false;
                    activeChatUserId = userData.uid;
                    currentRoomId = rId;
                    const b = document.getElementById(`badge-${rId}`);
                    if (b) b.classList.add('hidden');
                    setupChatUI(userData.displayName, userData.photoURL, userData.bio);
                    loadMessages();
                });
                usersListContainer.appendChild(row);
            });
        }

        function setupChatUI(title, avatarSrc, bioText) {
            activeChatName.textContent = title;
            activeChatAvatar.src = avatarSrc || 'https://via.placeholder.com/150';
            activeChatStatus.classList.remove('hidden');
            inputAreaContainer.classList.remove('hidden');
            chatColorPicker.classList.remove('hidden');
            btnClearHistory.classList.remove('hidden');
            callButtonsContainer.classList.remove('hidden');
            if (bioText) {
                activeChatBioContainer.classList.remove('hidden');
                activeChatBio.textContent = bioText;
            } else {
                activeChatBioContainer.classList.add('hidden');
            }
            // Hide sidebar on small screens after choosing a chat
            if (window.innerWidth < 768) {
                sidebarPanel.classList.add('hidden');
                sidebarPanel.classList.add('-translate-x-full');
            }
        }

        // Send Chat Message
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;
            sendChatMessage(text, null);
            messageInput.value = '';
        });

        function sendChatMessage(textPayload, imagePayload = null) {
            if (!currentRoomId) return;
            const messageDoc = {
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                senderId: currentUser.uid,
                displayName: currentUser.displayName,
                photoURL: currentUser.photoURL,
                text: imagePayload ? "[Photo Attachment]" : textPayload,
                image: imagePayload || null
            };

            db.collection('rooms').doc(currentRoomId).collection('messages').add(messageDoc);
        }

        // Load Messages Realtime
        function loadMessages() {
            if (messagesUnsubscribe) messagesUnsubscribe();

            messagesUnsubscribe = db.collection('rooms').doc(currentRoomId).collection('messages')
                .orderBy('createdAt', 'asc').limitToLast(100)
                .onSnapshot(snapshot => {
                    messagesContainer.innerHTML = '';
                    if (snapshot.empty) {
                        messagesContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 text-xs text-center p-4">🔒 Start conversation safely!</div>`;
                        return;
                    }
                    snapshot.forEach(doc => {
                        renderMessageRow(doc.id, doc.data());
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }

        // Render Individual Message Box with Delete and Forward options
        function renderMessageRow(msgId, msg) {
            if (!msg.createdAt) return;
            const isMe = msg.senderId === currentUser.uid;
            const row = document.createElement('div');
            row.className = `flex items-end gap-2.5 ${isMe ? 'justify-end' : 'justify-start'} group mb-2`;

            let bodyContent = msg.image
                ? `<img src="${msg.image}" class="max-w-xs rounded-xl max-h-60 object-cover mt-1 border border-white/10 cursor-pointer" onclick="window.open(this.src)">`
                : escapeHTML(msg.text);

            // Updated Action Panel: Allows deletion of any incoming/outgoing message inside the channel
            let actionButtons = `
                <div class="flex gap-2 mt-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="forwardMessage('${msgId}', \`${btoa(unescape(encodeURIComponent(msg.text || '')))}\`, '${msg.image || ''}')" class="text-[10px] text-indigo-400 bg-indigo-950/40 px-1.5 py-0.5 rounded border border-indigo-500/20 hover:bg-indigo-900/40">Forward ➡️</button>
                    <button onclick="deleteMessage('${msgId}')" class="text-[10px] text-rose-400 bg-rose-950/40 px-1.5 py-0.5 rounded border border-rose-500/20 hover:bg-rose-900/40">Delete 🗑️</button>
                </div>
            `;

            row.innerHTML = `
                ${!isMe ? `<img src="${msg.photoURL || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover border border-white/10">` : ''}
                <div class="flex flex-col max-w-[70%] ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[9px] text-slate-400 mb-0.5 px-1">${msg.displayName}</span>
                    <div class="px-3.5 py-2 rounded-2xl text-xs break-all ${isMe ? 'bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-br-none' : 'bg-white/10 text-slate-200 rounded-bl-none border border-white/5'}">
                        ${bodyContent}
                    </div>
                    ${actionButtons}
                </div>
                ${isMe ? `<img src="${msg.photoURL || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover border border-white/10">` : ''}
            `;
            messagesContainer.appendChild(row);
        }

        // Delete Message/Image Functionality (Both Sender and Receiver entries)
        window.deleteMessage = function (msgId) {
            if (confirm("Are you sure you want to delete this message permanently from this room?")) {
                db.collection('rooms').doc(currentRoomId).collection('messages').doc(msgId).delete()
                    .catch(err => alert("Error deleting message: " + err.message));
            }
        };

        // Forward Message Functionality
        window.forwardMessage = function (msgId, encodedText, imagePayload) {
            let decodedText = decodeURIComponent(escape(atob(encodedText)));
            if (allUsersCache.length === 0) return alert("No active users found to forward.");

            let targetList = allUsersCache.map((u, i) => `${i + 1}. ${u.displayName}`).join('\n');
            let choice = prompt(`Select user number to forward this message to:\n\n${targetList}`);
            if (!choice) return;

            let selectedUser = allUsersCache[parseInt(choice) - 1];
            if (!selectedUser) return alert("Invalid user selected.");

            let targetRoomId = currentUser.uid < selectedUser.uid ? `${currentUser.uid}_${selectedUser.uid}` : `${selectedUser.uid}_${currentUser.uid}`;

            db.collection('rooms').doc(targetRoomId).collection('messages').add({
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                senderId: currentUser.uid,
                displayName: currentUser.displayName,
                photoURL: currentUser.photoURL,
                text: imagePayload ? "[Forwarded Photo]" : `${decodedText} (Forwarded)`,
                image: imagePayload || null
            }).then(() => alert("Message Forwarded successfully!"));
        };

        // Clear Full Chat History Functionality
        btnClearHistory.addEventListener('click', () => {
            if (confirm("Clear full chat history for this room? This action cannot be undone.")) {
                db.collection('rooms').doc(currentRoomId).collection('messages').get().then(snapshot => {
                    let batch = db.batch();
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    batch.commit().then(() => alert("Chat history cleared completely!"));
                });
            }
        });

        // UI Responsive & Menu/Sidebar Toggle Helpers
        btnToggleUsers.addEventListener('click', () => {
            if (sidebarPanel.classList.contains('hidden')) {
                sidebarPanel.classList.remove('hidden');
                setTimeout(() => sidebarPanel.classList.remove('-translate-x-full'), 10);
            } else {
                sidebarPanel.classList.add('-translate-x-full');
                setTimeout(() => sidebarPanel.classList.add('hidden'), 300);
            }
        });

        btnCloseSidebar.addEventListener('click', () => {
            sidebarPanel.classList.add('-translate-x-full');
            setTimeout(() => sidebarPanel.classList.add('hidden'), 300);
        });

        function resetChatArea() {
            currentRoomId = null;
            activeChatName.textContent = "Select a user/group";
            inputAreaContainer.classList.add('hidden');
            chatColorPicker.classList.add('hidden');
            btnClearHistory.classList.add('hidden');
            callButtonsContainer.classList.add('hidden');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>

</html>
