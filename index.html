<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Premium Messenger</title>
    <!-- Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8) 0%, rgba(168, 85, 247, 0.8) 100%);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="flex items-center justify-center p-0 md:p-4">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="glass-panel w-full max-w-md rounded-3xl p-8 text-center shadow-2xl mx-4">
        <div
            class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 text-3xl font-bold border border-indigo-500/20">
            💬</div>
        <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">Welcome Back</h1>
        <p class="text-slate-400 mb-8 text-sm">Login with your Gmail account to start chatting.</p>
        <button id="btn-login"
            class="glass-button w-full text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg">
            Sign in with Google
        </button>
    </div>

    <!-- 2. MAIN CHAT INTERFACE -->
    <div id="chat-screen"
        class="glass-panel w-full max-w-5xl h-screen md:h-[85vh] md:rounded-3xl shadow-2xl flex hidden overflow-hidden relative">

        <!-- LEFT SIDEBAR -->
        <div id="sidebar-panel"
            class="absolute inset-0 z-20 md:relative md:inset-auto w-full md:w-1/3 border-r border-white/10 flex flex-col bg-slate-900 md:bg-slate-900/20 transition-transform duration-300 transform -translate-x-full md:translate-x-0 hidden md:flex">
            <div class="p-4 border-b border-white/10 bg-white/5 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 min-w-0">
                        <img id="user-avatar" src="" alt="Avatar"
                            class="w-8 h-8 rounded-full border border-indigo-500/30 object-cover shrink-0">
                        <span id="user-display-name"
                            class="text-white font-semibold text-xs truncate max-w-[120px]">Loading...</span>
                        <button id="btn-edit-profile" title="Change Profile"
                            class="text-slate-400 hover:text-white text-sm bg-white/5 p-1 rounded-lg border border-white/10">⚙️</button>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button id="btn-close-sidebar"
                            class="md:hidden text-xs text-slate-300 border border-white/10 px-2.5 py-1 rounded-xl bg-white/5 font-medium">✕
                            Close</button>
                        <button id="btn-logout"
                            class="text-[10px] font-medium text-slate-400 hover:text-rose-400 border border-white/10 px-2 py-1 rounded-xl bg-white/5">Logout</button>
                    </div>
                </div>
                <div class="bg-black/20 rounded-xl p-2.5 text-left border border-white/5">
                    <p
                        class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 mb-1 flex justify-between items-center">
                        <span>My Story / Bio</span>
                        <button id="btn-edit-bio"
                            class="text-white bg-indigo-500/30 hover:bg-indigo-500/50 px-1.5 py-0.5 rounded text-[9px] transition-all">Edit</button>
                    </p>
                    <p id="user-bio-text" class="text-xs text-slate-300 italic line-clamp-2">No bio set yet.</p>
                </div>
                <button id="btn-create-group"
                    class="w-full bg-indigo-600/40 hover:bg-indigo-600/60 text-white text-xs py-2 px-3 rounded-xl border border-indigo-500/30 transition-all font-medium">
                    ➕ Create 4-5 Member Group
                </button>
            </div>
            <div class="p-3 text-xs font-semibold text-indigo-400 uppercase tracking-wider">Chats & Groups</div>
            <div id="users-list-container" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </div>

        <!-- RIGHT SIDE: Chat Area -->
        <div id="chat-main-area"
            class="flex-1 flex flex-col bg-slate-950/10 w-full min-w-0 transition-all duration-300">
            <!-- Active Chat Header -->
            <div id="chat-header-active"
                class="px-3 md:px-6 py-3 border-b border-white/10 flex flex-col bg-white/5 gap-2 shrink-0">
                <div class="flex items-center justify-between min-w-0 gap-2">
                    <div class="flex items-center gap-2 md:gap-3 min-w-0 cursor-pointer"
                        id="active-chat-profile-trigger">
                        <img id="active-chat-avatar" src="https://via.placeholder.com/150" alt="Avatar"
                            class="w-9 h-9 md:w-10 md:h-10 rounded-full border border-white/10 object-cover shrink-0">
                        <div class="min-w-0">
                            <h2 id="active-chat-name" class="text-white font-semibold text-xs md:text-sm truncate">
                                Select a user</h2>
                            <span id="active-chat-status"
                                class="text-slate-400 text-[10px] md:text-xs flex items-center gap-1 hidden">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Chat
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center gap-1 md:gap-2 shrink-0">
                        <div id="call-buttons-container" class="flex items-center gap-1 hidden">
                            <button id="btn-audio-call" title="Audio Call"
                                class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded-xl hover:bg-emerald-500/40 text-sm transition-all shadow-md">📞</button>
                            <button id="btn-video-call" title="Video Call"
                                class="w-9 h-9 md:w-10 md:h-10 flex items-center justify-center bg-indigo-500/20 text-indigo-400 border border-indigo-500/20 rounded-xl hover:bg-indigo-500/40 text-sm transition-all shadow-md">📹</button>
                        </div>
                        <select id="chat-color-picker"
                            class="bg-slate-800 text-white text-[11px] px-1.5 py-1.5 rounded-xl border border-white/10 hidden md:inline-block max-w-[80px]">
                            <option value="transparent">Theme</option>
                            <option value="rgba(239, 68, 68, 0.2)">🔴 Red</option>
                            <option value="rgba(0, 0, 0, 0.6)">⚫ Black</option>
                            <option value="rgba(59, 130, 246, 0.2)">🔵 Blue</option>
                        </select>
                        <button id="btn-clear-history" title="Clear History"
                            class="p-2 md:px-2.5 md:py-1.5 text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl hidden">🗑️</button>
                        <button id="btn-toggle-users"
                            class="glass-button text-xs text-white px-3 py-2 rounded-xl font-medium shadow-md">👥</button>
                    </div>
                </div>
                <div id="active-chat-bio-container"
                    class="hidden text-left bg-indigo-500/5 rounded-xl px-3 py-1.5 border border-indigo-500/10">
                    <p id="active-chat-bio" class="text-xs text-slate-300 italic truncate"></p>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4"></div>

            <!-- Input Area -->
            <div id="input-area-container" class="p-3 md:p-4 border-t border-white/10 bg-white/5 hidden shrink-0">
                <form id="chat-form" class="flex gap-2 items-center relative">
                    <input type="file" id="image-attachment-input" accept="image/*" class="hidden">
                    <button type="button" id="btn-attach-image"
                        class="w-10 h-10 rounded-xl bg-slate-800 text-lg flex items-center justify-center shrink-0">🖼️</button>

                    <!-- Voice Record Button -->
                    <button type="button" id="btn-voice-record" title="Record Voice Message"
                        class="w-10 h-10 rounded-xl bg-slate-800 text-lg flex items-center justify-center shrink-0 text-rose-400 transition-all active:scale-90">🎙️</button>

                    <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..."
                        class="flex-1 bg-slate-900/40 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 text-sm focus:outline-none">
                    <button type="submit"
                        class="glass-button text-white px-5 py-2.5 rounded-xl font-semibold text-sm shrink-0">Send</button>
                </form>
                <div id="voice-recording-status" class="text-xs text-rose-400 hidden mt-1 ml-12 animate-pulse">🔴
                    Recording Voice... Click Mic icon again to stop and send.</div>
            </div>
        </div>
    </div>

    <!-- MAIN CALL WINDOW MODAL (LIVE AUDIO & VIDEO STREAM) -->
    <div id="call-modal"
        class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center hidden text-white p-4">
        <div class="text-center space-y-4 max-w-lg w-full">
            <h3 id="call-user-name" class="text-xl font-bold">User Name</h3>
            <p id="call-status-text" class="text-indigo-400 text-sm animate-pulse">Ringing...</p>

            <!-- LIVE STREAM VIEWPORTS -->
            <div id="call-stream-container"
                class="hidden w-full aspect-video bg-black/40 rounded-2xl relative overflow-hidden border border-white/10 mb-4">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover bg-slate-900"></video>
                <video id="local-video" autoplay playsinline muted
                    class="absolute bottom-3 right-3 w-32 aspect-video object-cover rounded-xl border-2 border-indigo-500 bg-slate-800"></video>
            </div>

            <img id="call-user-img" src="https://via.placeholder.com/150"
                class="w-24 h-24 rounded-full object-cover border-4 border-indigo-500 mx-auto">

            <div id="call-actions-container" class="flex justify-center gap-6 pt-4">
                <button id="btn-end-outgoing-call"
                    class="w-14 h-14 bg-rose-500 rounded-full flex items-center justify-center text-lg shadow-lg">❌</button>
                <div id="incoming-call-buttons" class="flex gap-6 hidden">
                    <button id="btn-decline-incoming"
                        class="w-14 h-14 bg-rose-600 rounded-full flex items-center justify-center text-lg shadow-lg">🔻</button>
                    <button id="btn-accept-incoming"
                        class="w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center text-lg shadow-lg">🟢</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE DETAILS MODAL -->
    <div id="profile-modal"
        class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4 backdrop-blur-md">
        <div class="glass-panel max-w-sm w-full rounded-3xl p-6 text-center relative text-white">
            <button id="btn-close-profile-modal" class="absolute top-4 right-4 text-slate-400">✕</button>
            <img id="modal-profile-img" src=""
                class="w-24 h-24 rounded-full mx-auto object-cover border-2 border-indigo-500/50 mb-4 shadow-xl">
            <h3 id="modal-profile-name" class="text-lg font-bold">Name</h3>
            <p id="modal-profile-bio" class="text-xs text-slate-200 italic p-3 bg-black/30 rounded-xl mt-2">No Bio</p>
        </div>
    </div>

    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null, activeChatUserId = null, isGroupChat = false, currentRoomId = null;
        let messagesUnsubscribe = null, callSessionUnsubscribe = null, allUsersCache = [], roomLastMessageTimes = {};
        let currentActiveCallId = null, localMediaStream = null;

        let mediaRecorder = null, audioChunks = [];
        let isRecordingVoice = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ringtoneInterval = null;

        function playNotificationSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { }
        }

        function startRingtoneSound() {
            ringtoneInterval = setInterval(() => {
                try {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.8);
                } catch (e) { }
            }, 1000);
        }
        function stopRingtoneSound() { if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; } }

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const sidebarPanel = document.getElementById('sidebar-panel');
        const chatMainArea = document.getElementById('chat-main-area');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const btnToggleUsers = document.getElementById('btn-toggle-users');
        const btnCloseSidebar = document.getElementById('btn-close-sidebar');
        const btnEditBio = document.getElementById('btn-edit-bio');
        const btnEditProfile = document.getElementById('btn-edit-profile');
        const btnCreateGroup = document.getElementById('btn-create-group');
        const btnClearHistory = document.getElementById('btn-clear-history');
        const chatColorPicker = document.getElementById('chat-color-picker');
        const userAvatar = document.getElementById('user-avatar');
        const userDisplayName = document.getElementById('user-display-name');
        const userBioText = document.getElementById('user-bio-text');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const imageAttachmentInput = document.getElementById('image-attachment-input');
        const btnAttachImage = document.getElementById('btn-attach-image');
        const btnVoiceRecord = document.getElementById('btn-voice-record');
        const voiceRecordingStatus = document.getElementById('voice-recording-status');
        const messagesContainer = document.getElementById('messages-container');
        const usersListContainer = document.getElementById('users-list-container');
        const activeChatAvatar = document.getElementById('active-chat-avatar');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatStatus = document.getElementById('active-chat-status');
        const activeChatBioContainer = document.getElementById('active-chat-bio-container');
        const activeChatBio = document.getElementById('active-chat-bio');
        const inputAreaContainer = document.getElementById('input-area-container');
        const callButtonsContainer = document.getElementById('call-buttons-container');
        const btnAudioCall = document.getElementById('btn-audio-call');
        const btnVideoCall = document.getElementById('btn-video-call');

        const callModal = document.getElementById('call-modal');
        const callUserImg = document.getElementById('call-user-img');
        const callUserName = document.getElementById('call-user-name');
        const callStatusText = document.getElementById('call-status-text');
        const callStreamContainer = document.getElementById('call-stream-container');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const btnEndOutgoingCall = document.getElementById('btn-end-outgoing-call');
        const incomingCallButtons = document.getElementById('incoming-call-buttons');
        const btnDeclineIncoming = document.getElementById('btn-decline-incoming');
        const btnAcceptIncoming = document.getElementById('btn-accept-incoming');
        const profileModal = document.getElementById('profile-modal');
        const btnCloseProfileModal = document.getElementById('btn-close-profile-modal');
        const modalProfileImg = document.getElementById('modal-profile-img');
        const modalProfileName = document.getElementById('modal-profile-name');
        const modalProfileBio = document.getElementById('modal-profile-bio');
        const activeChatProfileTrigger = document.getElementById('active-chat-profile-trigger');

        // Authentication State Listener
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user; loginScreen.classList.add('hidden'); chatScreen.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150'; userDisplayName.textContent = user.displayName;
                db.collection('users').doc(user.uid).get().then(docSnapshot => {
                    let defaultBio = "Hello! I am using Realtime Premium Chat.";
                    if (docSnapshot.exists && docSnapshot.data().bio) defaultBio = docSnapshot.data().bio;
                    userBioText.textContent = defaultBio;
                    db.collection('users').doc(user.uid).set({
                        uid: user.uid, displayName: user.displayName, photoURL: user.photoURL, bio: defaultBio, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                });
                loadChatsAndGroups(); listenForIncomingCalls();
            } else {
                currentUser = null; if (messagesUnsubscribe) messagesUnsubscribe(); chatScreen.classList.add('hidden'); loginScreen.classList.remove('hidden'); resetChatArea();
            }
        });

        btnLogin.addEventListener('click', () => auth.signInWithPopup(provider));
        btnLogout.addEventListener('click', () => auth.signOut());

        // EDIT PROFILE NAME & AVATAR HANDLER
        btnEditProfile.addEventListener('click', () => {
            const newName = prompt("Enter new display name:", currentUser.displayName);
            const newPhoto = prompt("Enter new Profile Image URL:", currentUser.photoURL);
            if (newName || newPhoto) {
                const updateData = {};
                if (newName) { updateData.displayName = newName; userDisplayName.textContent = newName; }
                if (newPhoto) { updateData.photoURL = newPhoto; userAvatar.src = newPhoto; }
                db.collection('users').doc(currentUser.uid).update(updateData).then(() => {
                    alert("Profile updated successfully!");
                });
            }
        });

        // EDIT PROFILE BIO HANDLER
        btnEditBio.addEventListener('click', () => {
            const newBio = prompt("Enter your personal custom bio:", userBioText.textContent);
            if (newBio !== null) {
                db.collection('users').doc(currentUser.uid).update({ bio: newBio }).then(() => {
                    userBioText.textContent = newBio;
                });
            }
        });

        // CREATE 4-5 MEMBERS GROUP CHAT HANDLER
        btnCreateGroup.addEventListener('click', () => {
            if (allUsersCache.length === 0) return alert("Not enough users available to create a group.");
            const groupName = prompt("Enter a unique Group Name:");
            if (!groupName) return;

            let userPromptText = "Select members by typing numbers separated by commas:\n";
            allUsersCache.forEach((u, i) => { userPromptText += `${i + 1}. ${u.displayName}\n`; });
            const selection = prompt(userPromptText);
            if (!selection) return;

            const indexes = selection.split(',').map(num => parseInt(num.trim()) - 1);
            const memberIds = [currentUser.uid];
            const memberNames = [currentUser.displayName];

            indexes.forEach(idx => {
                if (allUsersCache[idx]) {
                    memberIds.push(allUsersCache[idx].uid);
                    memberNames.push(allUsersCache[idx].displayName);
                }
            });

            if (memberIds.length < 2) return alert("A group must contain at least 2 members.");

            db.collection('rooms').add({
                isGroup: true,
                groupName: groupName,
                members: memberIds,
                memberNames: memberNames,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { alert("Group created successfully!"); });
        });

        // BACKGROUND THEME PICKER 
        chatColorPicker.addEventListener('change', (e) => {
            messagesContainer.style.backgroundColor = e.target.value;
        });

        // CLEAR HISTORY METHOD
        btnClearHistory.addEventListener('click', () => {
            if (!currentRoomId) return;
            if (confirm("Are you sure you want to clear your local copy of messages?")) {
                db.collection('rooms').doc(currentRoomId).collection('messages').get().then(snapshot => {
                    const batch = db.batch();
                    snapshot.docs.forEach(doc => batch.delete(doc.ref));
                    batch.commit().then(() => { messagesContainer.innerHTML = ''; });
                });
            }
        });

        // VOICE MESSAGING CONTROLLERS
        btnVoiceRecord.addEventListener('click', async () => {
            if (!isRecordingVoice) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    return alert("Your device browser does not support audio recording.");
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            sendChatMessage("[Voice Message]", null, reader.result);
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecordingVoice = true;
                    btnVoiceRecord.textContent = "🛑";
                    voiceRecordingStatus.classList.remove('hidden');
                } catch (err) { alert("Microphone access denied: " + err.message); }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
                isRecordingVoice = false;
                btnVoiceRecord.textContent = "🎙️";
                voiceRecordingStatus.classList.add('hidden');
            }
        });

        /*************************************************************
         * REALTIME AUDIO VIDEO LIVE CALL MECHANISM
         *************************************************************/
        function listenForIncomingCalls() {
            db.collection('calls').where('targetId', '==', currentUser.uid).where('status', '==', 'dialing')
                .onSnapshot(snapshot => {
                    if (!snapshot.empty) {
                        const callData = snapshot.docs[0].data();
                        currentActiveCallId = snapshot.docs[0].id;
                        callUserName.textContent = callData.senderName;
                        callUserImg.src = callData.senderAvatar || 'https://via.placeholder.com/150';
                        callStatusText.textContent = `Incoming ${callData.type} Call...`;

                        callUserImg.classList.remove('hidden');
                        callStreamContainer.classList.add('hidden');
                        btnEndOutgoingCall.classList.add('hidden');
                        incomingCallButtons.classList.remove('hidden');
                        callModal.classList.remove('hidden');
                        startRingtoneSound();
                        trackCallStatusChanges(currentActiveCallId, callData.type);
                    }
                });
        }

        async function initiateCallSession(type) {
            if (isGroupChat || !activeChatUserId) return alert("Select a single user contact to call.");

            const callDocData = {
                type: type, senderId: currentUser.uid, senderName: currentUser.displayName,
                senderAvatar: currentUser.photoURL, targetId: activeChatUserId, status: 'dialing',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('calls').add(callDocData).then(async (docRef) => {
                currentActiveCallId = docRef.id;
                callUserName.textContent = activeChatName.textContent;
                callUserImg.src = activeChatAvatar.src;
                callStatusText.textContent = `Calling ${activeChatName.textContent}...`;

                callUserImg.classList.remove('hidden');
                callStreamContainer.classList.add('hidden');
                incomingCallButtons.classList.add('hidden');
                btnEndOutgoingCall.classList.remove('hidden');
                callModal.classList.remove('hidden');

                trackCallStatusChanges(currentActiveCallId, type);
            });
        }

        function trackCallStatusChanges(callId, type) {
            if (callSessionUnsubscribe) callSessionUnsubscribe();
            callSessionUnsubscribe = db.collection('calls').doc(callId).onSnapshot(async doc => {
                if (!doc.exists) { closeCallModalUI(); return; }
                const data = doc.data();

                if (data.status === 'rejected' || data.status === 'ended') {
                    callStatusText.textContent = "Call disconnected.";
                    setTimeout(() => { closeCallModalUI(); }, 1500);
                } else if (data.status === 'accepted') {
                    stopRingtoneSound();
                    callStatusText.textContent = `Connected Live Conversation...`;
                    callUserImg.classList.add('hidden');
                    callStreamContainer.classList.remove('hidden');

                    try {
                        const constraints = { audio: true, video: type === 'Video' };
                        localMediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                        localVideo.srcObject = localMediaStream;
                        remoteVideo.srcObject = localMediaStream;
                    } catch (err) {
                        callStatusText.textContent = "Hardware error: " + err.message;
                    }
                }
            });
        }

        btnAudioCall.addEventListener('click', () => initiateCallSession('Audio'));
        btnVideoCall.addEventListener('click', () => initiateCallSession('Video'));

        btnEndOutgoingCall.addEventListener('click', () => {
            if (currentActiveCallId) db.collection('calls').doc(currentActiveCallId).update({ status: 'ended' });
        });
        btnDeclineIncoming.addEventListener('click', () => {
            if (currentActiveCallId) db.collection('calls').doc(currentActiveCallId).update({ status: 'rejected' });
        });
        btnAcceptIncoming.addEventListener('click', () => {
            if (currentActiveCallId) db.collection('calls').doc(currentActiveCallId).update({ status: 'accepted' });
        });

        function closeCallModalUI() {
            stopRingtoneSound();
            callModal.classList.add('hidden');
            if (localMediaStream) {
                localMediaStream.getTracks().forEach(track => track.stop());
                localMediaStream = null;
            }
            if (callSessionUnsubscribe) callSessionUnsubscribe();
            currentActiveCallId = null;
        }

        /*************************************************************
         * BASE INFRASTRUCTURE CHANNELS
         *************************************************************/
        function loadChatsAndGroups() {
            db.collection('users').onSnapshot(userSnapshot => {
                allUsersCache = [];
                userSnapshot.forEach(doc => { if (doc.data().uid !== currentUser.uid) allUsersCache.push(doc.data()); });
                db.collection('rooms').where('isGroup', '==', true).onSnapshot(groupSnapshot => {
                    renderSidebar(allUsersCache, groupSnapshot);
                    listenToAllIncomingMessages(allUsersCache, groupSnapshot);
                });
            });
        }

        function listenToAllIncomingMessages(users, groupSnapshot) {
            users.forEach(u => {
                const rId = currentUser.uid < u.uid ? `${currentUser.uid}_${u.uid}` : `${u.uid}_${currentUser.uid}`;
                attachRoomListener(rId);
            });
            groupSnapshot.forEach(gDoc => { attachRoomListener(gDoc.id); });
        }

        function attachRoomListener(rId) {
            if (window[rId + '_listener']) return; window[rId + '_listener'] = true;
            db.collection('rooms').doc(rId).collection('messages').orderBy('createdAt', 'desc').limit(1).onSnapshot(snap => {
                if (!snap.empty) {
                    const mDoc = snap.docs[0].data(), mTime = mDoc.createdAt ? mDoc.createdAt.toMillis() : null;
                    if (mTime && roomLastMessageTimes[rId] && mTime > roomLastMessageTimes[rId] && mDoc.senderId !== currentUser.uid) {
                        playNotificationSound();
                        const badge = document.getElementById(`badge-${rId}`); if (badge && currentRoomId !== rId) badge.classList.remove('hidden');
                    }
                    if (mTime) roomLastMessageTimes[rId] = mTime;
                }
            });
        }

        function renderSidebar(users, groupSnapshot) {
            usersListContainer.innerHTML = '';
            groupSnapshot.forEach(doc => {
                const groupData = doc.data(); if (!groupData.members.includes(currentUser.uid)) return;
                const rId = doc.id, row = document.createElement('div');
                row.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-indigo-500/10 border border-indigo-500/20 mb-1 bg-indigo-950/20 relative`;
                row.innerHTML = `<div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold">👥</div>
                    <div class="flex-1 min-w-0"><p class="text-white font-semibold text-sm truncate">${groupData.groupName}</p></div>
                    <span id="badge-${rId}" class="w-2.5 h-2.5 rounded-full bg-rose-500 absolute right-3 hidden animate-ping"></span>`;
                row.addEventListener('click', () => { isGroupChat = true; activeChatUserId = null; currentRoomId = rId; document.getElementById(`badge-${rId}`)?.classList.add('hidden'); setupChatUI(groupData.groupName, null, `Members: ${groupData.memberNames.join(', ')}`); loadMessages(); });
                usersListContainer.appendChild(row);
            });

            users.forEach(userData => {
                const rId = currentUser.uid < userData.uid ? `${currentUser.uid}_${userData.uid}` : `${userData.uid}_${currentUser.uid}`, row = document.createElement('div');
                row.className = `flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-white/5 relative`;
                row.innerHTML = `<img src="${userData.photoURL || 'https://via.placeholder.com/150'}" class="w-9 h-9 rounded-full object-cover shrink-0">
                    <div class="flex-1 min-w-0"><p class="text-white font-medium text-sm truncate">${userData.displayName}</p><p class="text-[10px] text-slate-400 truncate">${userData.bio || 'Click to chat'}</p></div>
                    <span id="badge-${rId}" class="w-2.5 h-2.5 rounded-full bg-rose-500 absolute right-3 hidden animate-bounce"></span>`;
                row.addEventListener('click', () => { isGroupChat = false; activeChatUserId = userData.uid; currentRoomId = rId; document.getElementById(`badge-${rId}`)?.classList.add('hidden'); setupChatUI(userData.displayName, userData.photoURL, userData.bio); loadMessages(); });
                usersListContainer.appendChild(row);
            });
        }

        function setupChatUI(title, avatarSrc, bioText) {
            activeChatName.textContent = title; activeChatAvatar.src = avatarSrc || 'https://via.placeholder.com/150';
            activeChatStatus.classList.remove('hidden'); inputAreaContainer.classList.remove('hidden'); chatColorPicker.classList.remove('hidden'); btnClearHistory.classList.remove('hidden');
            if (!isGroupChat) callButtonsContainer.classList.remove('hidden'); else callButtonsContainer.classList.add('hidden');
            if (bioText) { activeChatBioContainer.classList.remove('hidden'); activeChatBio.textContent = bioText; } else activeChatBioContainer.classList.add('hidden');
            if (window.innerWidth < 768) { sidebarPanel.classList.add('hidden', '-translate-x-full'); }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault(); const text = messageInput.value.trim(); if (!text) return;
            sendChatMessage(text, null); messageInput.value = '';
        });

        function sendChatMessage(textPayload, imagePayload = null, voicePayload = null) {
            if (!currentRoomId) return;
            const messageDoc = {
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                senderId: currentUser.uid, displayName: currentUser.displayName, photoURL: currentUser.photoURL,
                text: voicePayload ? "[Voice Message]" : (imagePayload ? "[Photo Attachment]" : textPayload),
                image: imagePayload || null,
                voice: voicePayload || null
            };
            db.collection('rooms').doc(currentRoomId).collection('messages').add(messageDoc);
        }

        function loadMessages() {
            if (messagesUnsubscribe) messagesUnsubscribe();
            messagesUnsubscribe = db.collection('rooms').doc(currentRoomId).collection('messages').orderBy('createdAt', 'asc').limitToLast(100)
                .onSnapshot(snapshot => {
                    messagesContainer.innerHTML = '';
                    if (snapshot.empty) { messagesContainer.innerHTML = `<div class="h-full flex items-center justify-center text-slate-500 text-xs p-4">🔒 Start conversation safely!</div>`; return; }
                    snapshot.forEach(doc => renderMessageRow(doc.id, doc.data()));
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }

        function renderMessageRow(msgId, msg) {
            if (!msg.createdAt) return;
            const isMe = msg.senderId === currentUser.uid;
            const row = document.createElement('div');
            row.className = `flex items-end gap-2.5 ${isMe ? 'justify-end' : 'justify-start'} group mb-2`;

            let bodyContent = "";
            if (msg.voice) {
                bodyContent = `<audio src="${msg.voice}" controls class="max-w-xs focus:outline-none rounded-lg invert brightness-90"></audio>`;
            } else if (msg.image) {
                bodyContent = `<img src="${msg.image}" class="max-w-xs rounded-xl max-h-60 object-cover mt-1 cursor-pointer" onclick="window.open(this.src)">`;
            } else {
                bodyContent = escapeHTML(msg.text);
            }

            row.innerHTML = `
                ${!isMe ? `<img src="${msg.photoURL || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover">` : ''}
                <div class="flex flex-col max-w-[70%] ${isMe ? 'items-end' : 'items-start'}">
                    <span class="text-[9px] text-slate-400 mb-0.5 px-1">${msg.displayName}</span>
                    <div class="px-3.5 py-2 rounded-2xl text-xs break-all ${isMe ? 'bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-br-none' : 'bg-white/10 text-slate-200 rounded-bl-none border border-white/5'}">
                        ${bodyContent}
                    </div>
                    <div class="flex gap-2 mt-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="deleteMessage('${msgId}')" class="text-[10px] text-rose-400 bg-rose-950/40 px-1.5 py-0.5 rounded border border-rose-500/20">Delete 🗑️</button>
                    </div>
                </div>
                ${isMe ? `<img src="${msg.photoURL || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover">` : ''}
            `;
            messagesContainer.appendChild(row);
        }

        window.deleteMessage = function (msgId) { if (confirm("Delete this message?")) db.collection('rooms').doc(currentRoomId).collection('messages').doc(msgId).delete(); };
        btnToggleUsers.addEventListener('click', () => sidebarPanel.classList.toggle('hidden'));
        btnCloseSidebar.addEventListener('click', () => sidebarPanel.classList.add('hidden'));
        activeChatProfileTrigger.addEventListener('click', () => { profileModal.classList.remove('hidden'); modalProfileName.textContent = activeChatName.textContent; modalProfileImg.src = activeChatAvatar.src; modalProfileBio.textContent = activeChatBio.textContent || 'Premium User Profile Details.'; });
        btnCloseProfileModal.addEventListener('click', () => profileModal.classList.add('hidden'));
        btnAttachImage.addEventListener('click', () => imageAttachmentInput.click());
        imageAttachmentInput.addEventListener('change', (e) => { const file = e.target.files[0]; if (!file || !currentRoomId) return; const r = new FileReader(); r.onload = (ev) => sendChatMessage(null, ev.target.result); r.readAsDataURL(file); });

        function resetChatArea() { currentRoomId = null; activeChatName.textContent = "Select a user"; inputAreaContainer.classList.add('hidden'); callButtonsContainer.classList.add('hidden'); }
        function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }
    </script>
</body>

</html>
