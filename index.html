<html lang="en">

            background-color: #f9fafb;
        }

        /* ডাইনামিক থিম বাবলস */
        .theme-pink .my-bubble {
            background-color: #D20062;
            color: white;
        }

        .theme-pink .theme-text {
            color: #D20062;
        }

        .theme-pink .theme-bg {
            background-color: #D20062;
        }

        .theme-blue .my-bubble {
            background-color: #0084FF;
            color: white;
        }

        .theme-blue .theme-text {
            color: #0084FF;
        }

        .theme-blue .theme-bg {
            background-color: #0084FF;
        }

        .theme-green .my-bubble {
            background-color: #24A148;
            color: white;
        }

        .theme-green .theme-text {
            color: #24A148;
        }

        .theme-green .theme-bg {
            background-color: #24A148;
        }

        .theme-purple .my-bubble {
            background-color: #7E22CE;
            color: white;
        }

        .theme-purple .theme-text {
            color: #7E22CE;
        }

        .theme-purple .theme-bg {
            background-color: #7E22CE;
        }

        .theme-dark .my-bubble {
            background-color: #374151;
            color: white;
        }

        .theme-dark .messenger-bg {
            background-color: #111827 !important;
        }

        .theme-dark .friend-bubble {
            background-color: #374151;
            color: white;
        }

        .theme-dark .theme-text {
            color: #9CA3AF;
        }

        .theme-dark .theme-bg {
            background-color: #374151;
        }

        .friend-bubble {
            background-color: #F3F3F3;
            color: #000;
            border-radius: 18px 18px 18px 4px;

        .my-bubble {
            border-radius: 18px 18px 4px 18px;

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);

        .hidden-pane {

        .scrollbar-none::-webkit-scrollbar {

        }

        .unread-highlight {
            background-color: #fdf2f8;
            border-left: 4px solid #D20062;
            font-weight: bold;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex justify-center items-center font-sans select-none theme-pink">

                <path fill="#FBBC05"
                    d="M5.32 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.62H1.21C.44 8.16 0 9.88 0 11.72s.44 3.56 1.21 5.1l4.11-3.11z" />
                <path fill="#EA4335"

            <div id="view-stories" class="hidden-pane flex flex-col h-full bg-gray-50">

        <div id="chat-box-pane" class="absolute inset-0 w-full h-full flex flex-col messenger-bg hidden-pane z-30">

            <div id="theme-panel"

                <div id="video-streams-container" class="mt-6 grid grid-cols-2 gap-3 max-w-sm mx-auto hidden-pane">

                    <div class="bg-gray-900 rounded-xl overflow-hidden border-2 border-gray-700 relative shadow-md">

                        class="fas fa-phone"></i></button>

        <div id="profile-modal"
            class="absolute inset-0 bg-black/60 z-50 hidden-pane flex items-center justify-center p-6"

                    class="w-24 h-24 rounded-full mx-auto border-4 border-pink-500 object-cover mb-3 shadow-md">
                <h3 id="modal-prof-name" class="text-lg font-bold text-gray-900">User Full Name</h3>
                <p id="modal-prof-email" class="text-xs text-gray-500 mt-1">user@gmail.com</p>
                <div class="mt-4 pt-3 border-t flex justify-center text-xs text-gray-400 font-medium">Messenger Official
                    Member</div>

        <div id="full-image-modal"
            class="absolute inset-0 bg-black/95 z-50 hidden-pane flex items-center justify-center p-4"
            onclick="this.classList.add('hidden-pane')">
            <img id="modal-target-img" src="" class="max-w-full max-h-[85vh] object-contain rounded">
        </div>

    <div id="msg-context-menu"
        class="absolute hidden-pane bg-white shadow-xl rounded-xl py-1 w-36 border text-sm z-50 overflow-hidden">
        <button id="ctx-forward"
            class="w-full text-left px-4 py-2.5 hover:bg-gray-50 flex items-center gap-2 text-gray-700"><i
                class="fas fa-share text-gray-400"></i> Forward</button>
        <button id="ctx-delete"
            class="w-full text-left px-4 py-2.5 hover:bg-gray-50 flex items-center gap-2 text-red-600"><i
                class="fas fa-trash"></i> Delete</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 আপনার অরিজিনাল Firebase Credentials এখানে বসিয়ে নিন
        const firebaseConfig = {
            apiKey: "AIzaSyCvW1eM0TD2afTBDWWqmSHksQbm3Esjl2I",
            authDomain: "tradingviews-77.firebaseapp.com",
            projectId: "tradingviews-77",
            storageBucket: "tradingviews-77.firebasestorage.app",
            messagingSenderId: "277785483742",
            appId: "1:277785483742:web:eea123b02bf1d2f987e54f",
            measurementId: "G-BTR2FS9EY5"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null, activeChatUser = null, selectedMessageId = null, base64StoryImage = null;
        let callRefGlobal = null, localStream = null, peerConnection = null, mediaRecorder = null, voiceChunks = [];

        // STUN / TURN সার্ভার কনফিগারেশন (WebRTC মিডিয়া স্ট্রিম বাউন্স করার জন্য ফ্রিতে গুগল প্রোভাইড করে)
        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        function playNotificationSound(type = 'sms') {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'sms') {
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'call') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime); gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start(); window.activeCallOsc = osc;
                }
            } catch (e) { }
        }
        function stopNotificationSound() { if (window.activeCallOsc) { try { window.activeCallOsc.stop(); } catch (e) { } window.activeCallOsc = null; } }

        window.viewFullImage = function (src) { document.getElementById('modal-target-img').src = src; document.getElementById('full-image-modal').classList.remove('hidden-pane'); };
        window.toggleThemePanel = function () { document.getElementById('theme-panel').classList.toggle('hidden-pane'); };
        window.changeTheme = function (themeName) { document.body.className = `bg-gray-100 h-screen flex justify-center items-center font-sans select-none theme-${themeName}`; document.getElementById('theme-panel').classList.add('hidden-pane'); };

        window.showProfileDetails = function (name, avatar, email) {
            document.getElementById('modal-prof-name').innerText = name;
            document.getElementById('modal-prof-avatar').src = avatar;
            document.getElementById('modal-prof-email').innerText = email || 'No email shared';
            document.getElementById('profile-modal').classList.remove('hidden-pane');
        };

        window.viewMyOwnProfile = function () { if (currentUser) showProfileDetails(currentUser.displayName, currentUser.photoURL, currentUser.email); };
        window.viewActiveChatUserProfile = function () { if (activeChatUser && !activeChatUser.isGroup) showProfileDetails(activeChatUser.name, activeChatUser.avatar, activeChatUser.email); };

        window.switchTab = function (tabName) {
            const tabs = ['chats', 'people', 'stories', 'discover'];
            tabs.forEach(t => { document.getElementById(`view-${t}`).classList.add('hidden-pane'); document.getElementById(`nav-${t}`).className = "flex flex-col items-center gap-0.5 text-gray-400 text-xs"; });
            document.getElementById(`view-${tabName}`).classList.remove('hidden-pane');
            document.getElementById(`nav-${tabName}`).className = "flex flex-col items-center gap-0.5 theme-text font-semibold text-xs";
            document.getElementById('page-title').innerText = tabName.charAt(0).toUpperCase() + tabName.slice(1);
            if (tabName === 'discover') loadDiscoverUsers();
            if (tabName === 'people') loadPeopleSection();
            if (tabName === 'stories') loadStoriesTimeline();
        };

        document.getElementById('btn-google-login').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth).then(() => location.reload()));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden-pane');
                document.getElementById('main-app').classList.remove('hidden-pane');
                document.getElementById('my-profile-pic').src = user.photoURL;
                set(ref(db, 'users/' + user.uid), { uid: user.uid, name: user.displayName, email: user.email, avatar: user.photoURL });
                loadChatList();
                listenToGlobalNotifications();
                listenForIncomingCalls();
            } else {
                document.getElementById('login-screen').classList.remove('hidden-pane');
                document.getElementById('main-app').classList.add('hidden-pane');
            }
        });

        function listenToGlobalNotifications() {
            onValue(ref(db, 'messages'), (snapshot) => {
                const rooms = snapshot.val(); if (!rooms) return;
                let alertUser = false;
                Object.keys(rooms).forEach(roomKey => {
                    if (roomKey.includes(currentUser.uid)) {
                        const msgs = Object.values(rooms[roomKey]); const lastMsg = msgs[msgs.length - 1];
                        if (lastMsg && lastMsg.sender_id !== currentUser.uid) {
                            if (!activeChatUser || !roomKey.includes(activeChatUser.uid)) {
                                alertUser = true;
                                document.getElementById(`inbox-card-${lastMsg.sender_id}`)?.classList.add('unread-highlight');
                            }
                        }
                    }
                });
                if (alertUser) playNotificationSound('sms');
            });
        }

        // 📞 REAL-TIME WebRTC AUDIO/VIDEO CALLING ENGINE WITH LIVE STREAM
        window.initiateLiveCall = async function (type) {
            if (!activeChatUser || activeChatUser.isGroup) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'Video' });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('video-streams-container').classList.remove('hidden-pane');

                const callId = `${currentUser.uid}_to_${activeChatUser.uid}`;
                callRefGlobal = ref(db, 'calls/' + callId);

                document.getElementById('call-screen-name').innerText = activeChatUser.name;
                document.getElementById('call-screen-avatar').src = activeChatUser.avatar;
                document.getElementById('call-screen-type').innerText = `Ringing (${type})...`;
                document.getElementById('btn-accept-call').classList.add('hidden-pane');
                document.getElementById('calling-screen').classList.remove('hidden-pane');
                playNotificationSound('call');

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (event) => {
                    document.getElementById('remote-video').srcObject = event.streams[0];
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        push(ref(db, `calls/${callId}/callerCandidates`), event.candidate.toJSON());
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                set(callRefGlobal, {
                    id: callId, callerId: currentUser.uid, callerName: currentUser.displayName,
                    callerAvatar: currentUser.photoURL, receiverId: activeChatUser.uid,
                    type: type, status: 'ringing', offer: { sdp: offer.sdp, type: offer.type }
                });

                // অ্যানসার এবং আইস ক্যান্ডিডেট লিসেনার ট্র্যাকিং
                onValue(ref(db, `calls/${callId}/answer`), async (snap) => {
                    const answer = snap.val();
                    if (answer && peerConnection.signalingState !== "stable") {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                        stopNotificationSound();
                        document.getElementById('call-screen-type').innerText = `🎙️ Call Connected (Live)`;
                    }
                });

                onValue(ref(db, `calls/${callId}/receiverCandidates`), (snap) => {
                    if (snap.exists()) {
                        Object.values(snap.val()).forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)));
                    }
                });

                onValue(callRefGlobal, (snap) => { if (!snap.val()) endLiveCall(); });

            } catch (err) { alert("Microphone/Camera initialization failed!"); console.error(err); }
        };

        function listenForIncomingCalls() {
            onValue(ref(db, 'calls'), (snapshot) => {
                if (!snapshot.val()) return;
                Object.values(snapshot.val()).forEach(async (call) => {
                    if (call.receiverId === currentUser.uid && call.status === 'ringing') {
                        callRefGlobal = ref(db, 'calls/' + call.id);
                        document.getElementById('call-screen-name').innerText = call.callerName;
                        document.getElementById('call-screen-avatar').src = call.callerAvatar;
                        document.getElementById('call-screen-type').innerText = `Incoming ${call.type} Call...`;
                        document.getElementById('btn-accept-call').classList.remove('hidden-pane');
                        document.getElementById('calling-screen').classList.remove('hidden-pane');
                        playNotificationSound('call');

                        document.getElementById('btn-accept-call').onclick = async () => {
                            try {
                                stopNotificationSound();
                                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: call.type === 'Video' });
                                document.getElementById('local-video').srcObject = localStream;
                                document.getElementById('video-streams-container').classList.remove('hidden-pane');

                                peerConnection = new RTCPeerConnection(rtcConfig);
                                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                                peerConnection.ontrack = (event) => {
                                    document.getElementById('remote-video').srcObject = event.streams[0];
                                };

                                peerConnection.onicecandidate = (event) => {
                                    if (event.candidate) {
                                        push(ref(db, `calls/${call.id}/receiverCandidates`), event.candidate.toJSON());
                                    }
                                };

                                await peerConnection.setRemoteDescription(new RTCSessionDescription(call.offer));
                                const answer = await peerConnection.createAnswer();
                                await peerConnection.setLocalDescription(answer);

                                await update(ref(db, `calls/${call.id}`), { status: 'connected', answer: { sdp: answer.sdp, type: answer.type } });

                                onValue(ref(db, `calls/${call.id}/callerCandidates`), (snap) => {
                                    if (snap.exists()) {
                                        Object.values(snap.val()).forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)));
                                    }
                                });

                                document.getElementById('call-screen-type').innerText = `🎙️ Call Connected (Live)`;
                                document.getElementById('btn-accept-call').classList.add('hidden-pane');
                            } catch (e) { alert("Media connection failed!"); console.error(e); }
                        };
                    }
                });
            });
        }

        window.endLiveCall = function () {
            stopNotificationSound();
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (callRefGlobal) { remove(callRefGlobal); callRefGlobal = null; }
            document.getElementById('calling-screen').classList.add('hidden-pane');
            document.getElementById('video-streams-container').classList.add('hidden-pane');
        };

        // 🎙️ অডিও ভয়েস মেসেজ ইঞ্জিন (রেকর্ডিং এবং অন্য ইউজারের শোনার সলিউশন)
        const voiceBtn = document.getElementById('btn-voice-record');
        let recordSeconds = 0, recordingInterval = null;

        voiceBtn.onclick = async () => {
            const voiceTimer = document.getElementById('voice-timer'); const voiceIcon = document.getElementById('voice-icon');
            if (!mediaRecorder) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    voiceChunks = [];

                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) voiceChunks.push(e.data); };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(voiceChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            let chatRoomId = activeChatUser.isGroup ? activeChatUser.uid : (currentUser.uid < activeChatUser.uid ? `${currentUser.uid}_${activeChatUser.uid}` : `${activeChatUser.uid}_${currentUser.uid}`);
                            const vRef = push(ref(db, 'messages/' + chatRoomId));
                            set(vRef, { id: vRef.key, sender_id: currentUser.uid, sender_name: currentUser.displayName, content: reader.result, type: 'voice', timestamp: Date.now() });
                        };
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorder.start();
                    recordingInterval = setInterval(() => { recordSeconds++; let mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0'); let secs = String(recordSeconds % 60).padStart(2, '0'); voiceTimer.innerText = `${mins}:${secs}`; }, 1000);
                    voiceTimer.classList.remove('hidden-pane'); voiceIcon.className = "fas fa-stop text-red-600 animate-ping";
                } catch (err) { alert("Microphone permissions required!"); }
            } else {
                clearInterval(recordingInterval); recordingInterval = null; recordSeconds = 0;
                voiceTimer.classList.add('hidden-pane'); voiceIcon.className = "fas fa-microphone";
                mediaRecorder.stop(); mediaRecorder = null;
            }
        };

        window.playVoiceNote = function (base64Data) {
            if (!base64Data) return;
            const audio = new Audio(base64Data);
            audio.play().catch(e => alert("Audio playback issue on this browser!"));
        };

        // 💬 চ্যাট অপারেশনস ও মেসেজ উইন্ডো
        window.startChatWith = function (uid, name, avatar, isGroup = false, email = '') {
            activeChatUser = { uid, name, avatar, isGroup, email };
            document.getElementById(`inbox-card-${uid}`)?.classList.remove('unread-highlight');
            document.getElementById('chat-username').innerText = name;
            document.getElementById('chat-avatar').src = avatar;
            document.getElementById('chat-box-pane').classList.remove('hidden-pane');
            listenToMessages();
        };

        document.getElementById('back-to-list').onclick = () => { document.getElementById('chat-box-pane').classList.add('hidden-pane'); activeChatUser = null; };
        document.getElementById('btn-send-msg').onclick = sendMessage;
        document.getElementById('msg-input').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

        function sendMessage() {
            const text = document.getElementById('msg-input').value.trim(); if (!text || !activeChatUser) return;
            let chatRoomId = activeChatUser.isGroup ? activeChatUser.uid : (currentUser.uid < activeChatUser.uid ? `${currentUser.uid}_${activeChatUser.uid}` : `${activeChatUser.uid}_${currentUser.uid}`);
            const msgRef = push(ref(db, 'messages/' + chatRoomId));
            set(msgRef, { id: msgRef.key, sender_id: currentUser.uid, sender_name: currentUser.displayName, content: text, type: 'text', timestamp: Date.now() });
            document.getElementById('msg-input').value = '';
        }

        function listenToMessages() {
            if (!activeChatUser) return;
            let chatRoomId = activeChatUser.isGroup ? activeChatUser.uid : (currentUser.uid < activeChatUser.uid ? `${currentUser.uid}_${activeChatUser.uid}` : `${activeChatUser.uid}_${currentUser.uid}`);

            onValue(ref(db, 'messages/' + chatRoomId), (snapshot) => {
                const msgContainer = document.getElementById('message-container'); msgContainer.innerHTML = '';
                if (snapshot.val()) {
                    Object.values(snapshot.val()).forEach(msg => {
                        const isMe = msg.sender_id === currentUser.uid;
                        const wrapper = document.createElement('div'); wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} w-full mb-1`;

                        let innerContent = '';
                        if (msg.type === 'image') innerContent = `<img src="${msg.content}" class="max-w-[180px] rounded-xl border cursor-pointer" onclick="viewFullImage('${msg.content}')">`;
                        else if (msg.type === 'voice') innerContent = `<button onclick="playVoiceNote('${msg.content}')" class="flex items-center gap-2 px-4 py-2 bg-pink-100 text-pink-700 rounded-xl text-xs font-bold shadow-sm transition active:scale-95"><i class="fas fa-play"></i> Listen Voice Note</button>`;
                        else innerContent = `<p class="px-4 py-2 text-sm shadow-sm ${isMe ? 'my-bubble' : 'friend-bubble'}">${msg.content}</p>`;

                        const msgDiv = document.createElement('div'); msgDiv.innerHTML = innerContent;
                        msgDiv.addEventListener('contextmenu', (e) => {
                            e.preventDefault(); selectedMessageId = { room: chatRoomId, msgId: msg.id, text: msg.content, type: msg.type };
                            const menu = document.getElementById('msg-context-menu'); menu.style.top = `${e.pageY}px`; menu.style.left = `${e.pageX}px`; menu.classList.remove('hidden-pane');
                        });
                        wrapper.appendChild(msgDiv); msgContainer.appendChild(wrapper);
                    });
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                }
            });
        }

        document.addEventListener('click', () => document.getElementById('msg-context-menu').classList.add('hidden-pane'));
        document.getElementById('ctx-delete').onclick = () => { if (selectedMessageId) remove(ref(db, `messages/${selectedMessageId.room}/${selectedMessageId.msgId}`)); };

        document.getElementById('ctx-forward').onclick = () => {
            if (!selectedMessageId) return;
            const targetUser = prompt("Enter Friend Name exactly to Forward:"); if (!targetUser) return;
            onValue(ref(db, 'users'), (snap) => {
                Object.values(snap.val() || {}).forEach(u => {
                    if (u.name.toLowerCase() === targetUser.toLowerCase()) {
                        let fRoom = currentUser.uid < u.uid ? `${currentUser.uid}_${u.uid}` : `${u.uid}_${currentUser.uid}`;
                        const fwdRef = push(ref(db, 'messages/' + fRoom));
                        set(fwdRef, { id: fwdRef.key, sender_id: currentUser.uid, sender_name: currentUser.displayName, content: selectedMessageId.text, type: selectedMessageId.type, timestamp: Date.now() });
                        alert('Forwarded!');
                    }
                });
            }, { onlyOnce: true });
        };

        window.clearChatHistory = function () {
            if (!activeChatUser) return;
            if (confirm(`Clear all history with ${activeChatUser.name}?`)) {
                let chatRoomId = activeChatUser.isGroup ? activeChatUser.uid : (currentUser.uid < activeChatUser.uid ? `${currentUser.uid}_${activeChatUser.uid}` : `${activeChatUser.uid}_${currentUser.uid}`);
                remove(ref(db, 'messages/' + chatRoomId));
            }
        };

        // 👥 DISCOVER & FRIEND REQUESTS ENGINE
        function loadDiscoverUsers() {
            onValue(ref(db, 'users'), (snapshot) => {
                const container = document.getElementById('discover-users-list'); container.innerHTML = ''; if (!snapshot.val()) return;
                Object.values(snapshot.val()).forEach(u => {
                    if (u.uid === currentUser.uid) return;
                    const row = document.createElement('div'); row.className = "flex justify-between items-center py-2.5 border-b";
                    row.innerHTML = `<div class="flex items-center gap-2 cursor-pointer" onclick="showProfileDetails('${u.name}','${u.avatar}','${u.email}')"><img src="${u.avatar}" class="w-9 h-9 rounded-full"><span class="text-sm font-medium">${u.name}</span></div>
                    <button id="req-${u.uid}" class="theme-bg text-white text-xs px-3 py-1 rounded-full font-bold">Add Friend</button>`;
                    container.appendChild(row);
                    document.getElementById(`req-${u.uid}`).onclick = () => {
                        set(ref(db, `requests/${u.uid}/${currentUser.uid}`), { fromId: currentUser.uid, fromName: currentUser.displayName, fromAvatar: currentUser.photoURL, fromEmail: currentUser.email });
                        alert('Friend Request Sent!');
                    };
                });
            });
        }

        function loadPeopleSection() {
            onValue(ref(db, `requests/${currentUser.uid}`), (snapshot) => {
                const box = document.getElementById('friend-requests-list'); box.innerHTML = '';
                if (!snapshot.exists()) { box.innerHTML = '<p class="text-xs text-gray-400 p-2">No pending friend requests.</p>'; return; }

                Object.values(snapshot.val()).forEach(r => {
                    const d = document.createElement('div'); d.className = "flex justify-between items-center bg-white p-2 rounded-lg shadow-sm border mb-2";
                    d.innerHTML = `<div class="flex items-center gap-2"><img src="${r.fromAvatar}" class="w-8 h-8 rounded-full"><span class="text-xs font-bold">${r.fromName}</span></div>
                    <button id="acc-${r.fromId}" class="bg-green-500 text-white text-xs px-3 py-1 rounded-full font-bold">Accept</button>`;
                    box.appendChild(d);

                    document.getElementById(`acc-${r.fromId}`).onclick = () => {
                        set(ref(db, `friends/${currentUser.uid}/${r.fromId}`), true);
                        set(ref(db, `friends/${r.fromId}/${currentUser.uid}`), true);
                        remove(ref(db, `requests/${currentUser.uid}/${r.fromId}`)).then(() => { alert("Friend Request Accepted!"); });
                    };
                });
            });

            onValue(ref(db, `friends/${currentUser.uid}`), (snapshot) => {
                const box = document.getElementById('friends-list'); box.innerHTML = '';
                if (!snapshot.exists()) return;
                Object.keys(snapshot.val()).forEach(fId => {
                    onValue(ref(db, `users/${fId}`), (uSnap) => {
                        const u = uSnap.val(); if (!u) return;
                        const r = document.createElement('div'); r.className = "flex justify-between items-center p-2.5 bg-gray-50 rounded-xl hover:bg-gray-100 cursor-pointer";
                        r.innerHTML = `<div class="flex items-center gap-2.5"><img src="${u.avatar}" class="w-9 h-9 rounded-full border"><span class="text-sm font-bold text-gray-800">${u.name}</span></div><span class="text-xs text-green-500 font-semibold">Active</span>`;
                        r.onclick = () => startChatWith(u.uid, u.name, u.avatar, false, u.email);
                        box.appendChild(r);
                    });
                });
            });
        }

        // 📢 STORIES TIMELINE
        document.getElementById('btn-select-story-img').onclick = () => document.getElementById('story-image-input').click();
        document.getElementById('story-image-input').onchange = (e) => {
            const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { base64StoryImage = ev.target.result; document.getElementById('story-img-preview').innerHTML = `<img src="${base64StoryImage}" class="w-full h-24 object-cover rounded">`; document.getElementById('story-img-preview').classList.remove('hidden-pane'); }; reader.readAsDataURL(file); }
        };
        document.getElementById('btn-post-story').onclick = () => {
            const bio = document.getElementById('story-bio').value.trim(); if (!bio && !base64StoryImage) return;
            const newStoryRef = push(ref(db, 'stories'));
            set(newStoryRef, { storyId: newStoryRef.key, userUid: currentUser.uid, userName: currentUser.displayName, userAvatar: currentUser.photoURL, bio: bio, image: base64StoryImage || null, timestamp: Date.now() })
                .then(() => { document.getElementById('story-bio').value = ''; document.getElementById('story-img-preview').classList.add('hidden-pane'); base64StoryImage = null; });
        };

        function loadStoriesTimeline() {
            onValue(ref(db, 'stories'), (snapshot) => {
                const container = document.getElementById('stories-feed'); container.innerHTML = ''; if (!snapshot.val()) return;
                Object.values(snapshot.val()).reverse().forEach(s => {
                    const card = document.createElement('div'); card.className = "bg-white p-4 rounded-xl shadow-sm border space-y-2 relative";
                    let totalLikes = s.likes ? Object.keys(s.likes).length : 0;

                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2"><img src="${s.userAvatar}" class="w-8 h-8 rounded-full"><div><h5 class="text-xs font-bold">${s.userName}</h5></div></div>
                            ${s.userUid === currentUser.uid ? `<button id="del-st-${s.storyId}" class="text-gray-300 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                        ${s.bio ? `<p class="text-xs text-gray-700">${s.bio}</p>` : ''}
                        ${s.image ? `<img src="${s.image}" class="w-full rounded border cursor-pointer" onclick="viewFullImage('${s.image}')">` : ''}
                        <div class="flex gap-4 text-[11px] pt-1 border-t"><button id="like-${s.storyId}" class="text-gray-500"><i class="fas fa-thumbs-up"></i> Like (${totalLikes})</button></div>
                        <div id="comments-box-${s.storyId}" class="space-y-1 text-[11px] text-gray-600"></div>
                        <div class="flex gap-1"><input type="text" id="comment-in-${s.storyId}" placeholder="Comment..." class="bg-gray-100 px-3 py-1 rounded-full text-xs flex-1 focus:outline-none"><button id="comment-sub-${s.storyId}" class="theme-text text-xs font-bold">Post</button></div>
                    `;
                    container.appendChild(card);

                    if (s.userUid === currentUser.uid) { document.getElementById(`del-st-${s.storyId}`).onclick = () => { if (confirm("Delete this post permanently?")) remove(ref(db, 'stories/' + s.storyId)); }; }
                    document.getElementById(`like-${s.storyId}`).onclick = () => { if (s.likes && s.likes[currentUser.uid]) remove(ref(db, `stories/${s.storyId}/likes/${currentUser.uid}`)); else set(ref(db, `stories/${s.storyId}/likes/${currentUser.uid}`), true); };
                    document.getElementById(`comment-sub-${s.storyId}`).onclick = () => { const el = document.getElementById(`comment-in-${s.storyId}`); if (!el.value.trim()) return; push(ref(db, `stories/${s.storyId}/comments`), { name: currentUser.displayName, text: el.value.trim() }); el.value = ''; };
                    onValue(ref(db, `stories/${s.storyId}/comments`), (cSnap) => { const box = document.getElementById(`comments-box-${s.storyId}`); if (box) { box.innerHTML = ''; if (cSnap.exists()) Object.values(cSnap.val()).forEach(c => box.innerHTML += `<p><b>${c.name}:</b> ${c.text}</p>`); } });
                });
            });
        }

        document.getElementById('btn-send-image').onclick = () => document.getElementById('image-input').click();
        document.getElementById('image-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file && activeChatUser) {
                const reader = new FileReader(); reader.onload = (event) => {
                    let chatRoomId = activeChatUser.isGroup ? activeChatUser.uid : (currentUser.uid < activeChatUser.uid ? `${currentUser.uid}_${activeChatUser.uid}` : `${activeChatUser.uid}_${currentUser.uid}`);
                    const imgRef = push(ref(db, 'messages/' + chatRoomId));
                    set(imgRef, { id: imgRef.key, sender_id: currentUser.uid, sender_name: currentUser.displayName, content: event.target.result, type: 'image', timestamp: Date.now() });
                }; reader.readAsDataURL(file);
            }
        };

        window.createGroupModal = function () { const groupName = prompt("Group Name:"); if (!groupName) return; const gRef = push(ref(db, 'groups')); set(gRef, { groupId: gRef.key, groupName: groupName, avatar: 'https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?q=80&w=150', timestamp: Date.now() }); };

        function loadChatList() {
            onValue(ref(db, 'users'), (snapshot) => {
                const inboxList = document.getElementById('inbox-list'); const activeStories = document.getElementById('active-stories');
                inboxList.innerHTML = ''; activeStories.innerHTML = ''; if (!snapshot.val()) return;
                Object.values(snapshot.val()).forEach(p => {
                    if (p.uid !== currentUser.uid) {
                        const item = document.createElement('div'); item.id = `inbox-card-${p.uid}`; item.className = "flex items-center gap-3 p-3 hover:bg-gray-50 cursor-pointer";
                        item.innerHTML = `<img src="${p.avatar}" class="w-10 h-10 rounded-full border"><div class="flex-1"><h4 class="font-semibold text-sm">${p.name}</h4><p class="text-xs text-gray-400 truncate">Tap to chat / view profile</p></div>`;
                        item.onclick = () => startChatWith(p.uid, p.name, p.avatar, false, p.email); inboxList.appendChild(item);
                        activeStories.innerHTML += `<div class="flex flex-col items-center flex-shrink-0 cursor-pointer" onclick="startChatWith('${p.uid}', '${p.name}', '${p.avatar}', false, '${p.email}')"><img src="${p.avatar}" class="w-10 h-10 rounded-full ring-2 ring-pink-500 p-0.5"><span class="text-[10px] mt-1 text-gray-500 w-12 truncate text-center">${p.name.split(' ')[0]}</span></div>`;
                    }
                });
                onValue(ref(db, 'groups'), (gSnapshot) => {
                    Object.values(gSnapshot.val() || {}).forEach(g => {
                        const gItem = document.createElement('div'); gItem.className = "flex items-center gap-3 p-3 bg-pink-50/20 hover:bg-pink-50 cursor-pointer border-l-4 border-pink-600";
                        gItem.innerHTML = `<img src="${g.avatar}" class="w-10 h-10 rounded-full"><div class="flex-1"><h4 class="font-bold text-sm">${g.groupName}</h4><p class="text-xs text-pink-600">Public Group Channel</p></div>`;
                        gItem.onclick = () => startChatWith(g.groupId, g.groupName, g.avatar, true); inboxList.insertBefore(gItem, inboxList.firstChild);
                    });
                });
            });
        }
    </script>
</body>
